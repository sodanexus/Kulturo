<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Kulturo — Votre journal culturel personnel. Suivez vos jeux, films, séries, livres et les prochaines sorties." />
  <title>Kulturo</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0c0d11" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kulturo" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- Favicon -->
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icon-192.png" type="image/png" />

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════
       Point de montage de l'application.
       Tout le HTML est injecté dynamiquement par app.js.
       ═══════════════════════════════════════════════════════ -->
  <div id="app">
    <!-- État de chargement initial -->
    <div style="
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      height:100dvh;
      flex-direction:column;
      gap:1rem;
      color:#a0a0b0;
      font-family:'Manrope',system-ui,sans-serif;
    ">
      <div class="spinner"></div>
      <span style="font-size:.875rem">Chargement…</span>
    </div>
  </div>

  <!-- ── Configuration publique du navigateur ── -->
  <!--
    config.js contient uniquement l'URL/clé publique Supabase,
    la clé TMDb et l'identifiant public IGDB. Les secrets Groq
    et IGDB restent dans les Supabase Edge Functions.
  -->
  <!-- config.js chargé en bloquant AVANT le module -->
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/Kulturo/sw.js")
          .then(registration => {
            console.log("[SW] Enregistré :", registration.scope);

            const announceUpdate = () => {
              if (!registration.waiting || !navigator.serviceWorker.controller) return;
              window.__kulturoUpdateRegistration = registration;
              window.dispatchEvent(new CustomEvent("kulturo:update-ready", { detail: { registration } }));
            };

            announceUpdate();
            registration.addEventListener("updatefound", () => {
              const worker = registration.installing;
              if (!worker) return;
              worker.addEventListener("statechange", () => {
                if (worker.state === "installed") announceUpdate();
              });
            });

            // GitHub Pages peut conserver le service worker quelques minutes.
            // Cette vérification reste légère et ne touche jamais aux données.
            setTimeout(() => registration.update().catch(() => {}), 1500);
          })
          .catch(e => console.warn("[SW] Erreur :", e));

        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!window.__kulturoUpdateAccepted || window.__kulturoReloading) return;
          window.__kulturoReloading = true;
          window.location.reload();
        });
      });
    }
  </script>

</body>
</html>
