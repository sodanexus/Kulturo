  --brand-gold:  #d8b46a;
  --brand-coral: #e8553a;
  --brand-teal:  #1fa88c;
  --brand-blue:  #7ea6ff;
  --brand-blue-glow: rgba(126,166,255,.15);
  --brand-gold-glow:  rgba(216,180,106,.16);
  --brand-coral-glow: rgba(232,85,58,.15);
  --brand-teal-glow:  rgba(31,168,140,.15);
  --accent:      var(--brand-gold);
  --accent-2:    #efcf8c;
  --accent-glow: var(--brand-gold-glow);
  --game:        #7ea6ff;
  --movie:       #ff7f96;
  --book:        #69d4a2;
  --danger:      #f07178;
  --success:     var(--brand-teal);
  --warn:        #e8a968;
  --radius-sm:   10px;
  --radius:      14px;
  --radius-lg:   18px;
  --radius-xl:   22px;
  --radius-pill: 999px;
  --shadow:      0 10px 30px rgba(0,0,0,.24);
  --shadow-lg:   0 24px 70px rgba(0,0,0,.42);
  --media-cover-shadow:       0 8px 22px rgba(0,0,0,.16);
  --media-cover-shadow-hover: 0 14px 34px rgba(0,0,0,.28);
  --media-hover-scale:        1.015;
  --media-press-scale:        .98;
  --media-rail-gap:           .75rem;
  --media-rail-gutter:        .65rem;
  --motion-fast: 140ms;
  --motion-base: 220ms;
  --motion-slow: 320ms;
  --transition:  var(--motion-base) cubic-bezier(.2,.8,.2,1);
  --font-body:   'Manrope', system-ui, sans-serif;
  --font-display:'Archivo', 'Manrope', system-ui, sans-serif;
  /* Échelle typographique unique : 9 / 10 / 11 / 12 / 13 / 14 / 16 / 18 / 22 / 24 px. */
  --type-brandline:    .5625rem;
  --type-micro:        .625rem;
  --type-caption:      .6875rem;
  --type-label:        .75rem;
  --type-control:      .8125rem;
  --type-body:         .875rem;
  --type-lead:         1rem;
  --type-title-sm:     1.125rem;
  --type-title-md:     1.375rem;
  --type-title-lg:     1.5rem;
  --type-page-title:   clamp(1.75rem, 4vw, 2.375rem);
  --type-section-title:clamp(1.375rem, 3vw, 1.75rem);
  --type-detail-title: clamp(1.125rem, 4.5vw, 1.375rem);
  --type-metric-md:    2rem;
  --type-metric-lg:    2.25rem;
  --type-metric-xl:    2.5rem;
  --text-1:      #fbfaf7;
  --content-px:  0px;
  --topbar-height: 63px;
  --fallback-img: none;
  --drift:       1;
  /* Zones réservées par iOS en mode web app (encoche, Dynamic Island, home indicator). */
  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-right:  env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left:   env(safe-area-inset-left, 0px);
}

/* ── Reset ────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html {
  min-height: 100%;
  scroll-behavior: smooth;
  background: var(--bg);
  /* Conserve le pincement à deux doigts, mais évite le zoom au double-tap. */
  touch-action: manipulation;
}
body {
  font-family: var(--font-body);
  font-size: var(--type-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  min-height: 100dvh;
  transition: background var(--transition), color var(--transition);
  -webkit-font-smoothing: antialiased;
}
img { display: block; max-width: 100%; }
button { cursor: pointer; font-family: inherit; -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
input, textarea, select {
  font-family: inherit;
  background: var(--bg-3);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--radius);
  padding: .6rem .9rem;
  font-size: var(--type-body);
  transition: border var(--transition), box-shadow var(--transition);
  width: 100%;
}
input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
textarea { resize: vertical; min-height: 80px; }
[hidden] { display: none !important; }

:where(button, a, input, textarea, select, [role="button"]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

/* ── Typography ───────────────────────────────────────────── */
h1, h2, h3 { font-family: var(--font-body); line-height: 1.2; }
h1 { font-size: var(--type-page-title); font-weight: 800; }
h2 { font-size: var(--type-section-title); font-weight: 800; }
h3 { font-size: var(--type-title-sm); font-weight: 700; }
.label { font-size: var(--type-label); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }

/* ── Scrollbar ────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 99px; }

/* ── Layout ───────────────────────────────────────────────── */
#app {
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: auto 1fr;
  min-height: 100vh;
  min-height: 100dvh;
}

/* ── Topbar ───────────────────────────────────────────────── */
#topbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 0;
  padding: calc(.75rem + var(--safe-top)) 0 .75rem;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 200;
}
.topbar-logo {
  font-family: var(--font-display);
  font-size: var(--type-title-md);
  font-weight: 900;
  color: var(--accent);
  letter-spacing: -.02em;
  white-space: nowrap;
  padding-left: max(1.5rem, calc(1rem + var(--safe-left)));
  width: 220px;
  flex-shrink: 0;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  flex-direction: row;
  gap: .65rem;
  line-height: 1;
}
.topbar-mark {
  display: block;
  flex: 0 0 auto;
  width: 64px;
  height: 38px;
  object-fit: contain;
}
.topbar-brand-copy {
  display: flex;
  flex-direction: column;
  min-width: 0;
  gap: .05rem;
}
.topbar-wordmark { display: block; }
.topbar-search-wrap {
  flex: 1;
  max-width: 560px;
  position: relative;
  margin: 0 auto;
}
.topbar-right {
  padding-right: 1rem;
  display: flex;
  align-items: center;
  gap: .5rem;
  padding-right: max(2rem, calc(1rem + var(--safe-right)));
  flex-shrink: 0;
}
.network-status {
  position: fixed;
  top: calc(var(--safe-top) + var(--topbar-height) + .55rem);
  right: max(1rem, var(--safe-right));
  z-index: 180;
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  min-height: 30px;
  padding: .35rem .65rem;
  border: 1px solid color-mix(in srgb, var(--brand-coral) 38%, var(--border));
  border-radius: var(--radius-pill);
  background: color-mix(in srgb, var(--bg-2) 94%, transparent);
  box-shadow: var(--shadow);
  color: var(--brand-coral);
  font-size: var(--type-caption);
  font-weight: 700;
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
}
.network-status[hidden] { display: none; }
.network-status svg { width: 15px; height: 15px; flex: 0 0 auto; }
.topbar-tagline {
  font-size: var(--type-brandline);
  font-weight: 500;
  color: var(--text-3);
  letter-spacing: .04em;
  text-transform: uppercase;
  font-family: var(--font-body, sans-serif);
}
.topbar-search-wrap input {
  padding-left: 2.4rem;
  background: var(--bg-3);
  height: 38px;
}
.topbar-search-wrap .search-icon {
  position: absolute;
  left: .75rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-3);
  pointer-events: none;
}
.btn-icon {
  width: 36px;
  height: 36px;
  border: none;
  background: var(--bg-3);
  color: var(--text-2);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--transition), color var(--transition);
}
.btn-icon:hover { background: var(--bg-4); color: var(--text); }
.btn-icon.active { background: var(--accent-glow); color: var(--accent); }

/* ── Sidebar ──────────────────────────────────────────────── */
/* ── Sidebar — icônes seules ──────────────────────────────── */
#sidebar {
  position: fixed;
  top: calc(var(--topbar-height) + var(--safe-top));
  left: var(--safe-left);
  height: calc(100vh - var(--topbar-height) - var(--safe-top));
  height: calc(100dvh - var(--topbar-height) - var(--safe-top));
  width: 56px;
  background: var(--bg-2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 1rem 0;
  gap: 0;
  z-index: 100;
  overflow: visible;
}

.nav-items-group {
  display: flex;
  flex-direction: column;
  gap: .15rem;
  padding: 0 .5rem;
  flex: 1;
}

.nav-section-label { display: none; }

.nav-item {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: .65rem;
  border-radius: var(--radius);
  color: var(--text-3);
  cursor: pointer;
  transition: background var(--transition), color var(--transition);
  border: none;
  background: transparent;
  width: 100%;
  min-height: 40px;
  position: relative;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.nav-item > .nav-icon,
.nav-item > .nav-label { pointer-events: none; }
.nav-item:hover { background: var(--bg-3); color: var(--text); }
.nav-item.active { background: var(--accent-glow); color: var(--accent); }

.nav-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.nav-label { display: none; }
.nav-item .nav-badge { display: none; }

/* Trait accent sur l'item actif */
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 2px;
  height: 16px;
  background: var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0;
}

/* Tooltip au survol */
.nav-item::after {
  content: attr(data-tooltip);
  position: absolute;
  left: calc(100% + 10px);
  top: 50%;
  transform: translateY(-50%);
  background: var(--bg-4);
  color: var(--text);
  font-size: var(--type-label);
  font-weight: 500;
  padding: .3em .7em;
  border-radius: var(--radius);
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity .15s;
  border: 1px solid var(--border);
  z-index: 200;
}
.nav-item:hover::after { opacity: 1; }

/* Pin button — supprimé */
.sidebar-pin { display: none; }

/* ── Main content ─────────────────────────────────────────── */
#main {
  padding: .75rem 2rem 4rem;
  padding-left: calc(56px + max(2rem, calc(1rem + var(--safe-left))));
  overflow-y: auto;
  height: calc(100vh - var(--topbar-height) - var(--safe-top));
  height: calc(100dvh - var(--topbar-height) - var(--safe-top));
  padding-right: max(2rem, calc(1rem + var(--safe-right)));
}

/* .page rules consolidated in animation block below */

/* ── Page header ──────────────────────────────────────────── */
.page-header {
  display: flex;
  align-items: flex-start;
  gap: 1rem;
  margin-bottom: .25rem;
  flex-wrap: wrap;
}
.page-header h2 { flex: 1; }
.page-actions { display: flex; gap: .5rem; flex-wrap: wrap; }

/* ── Buttons ──────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  padding: .5rem 1.1rem;
  border-radius: var(--radius);
  border: none;
  font-size: var(--type-body);
  font-weight: 600;
  cursor: pointer;
  transition: background-color var(--transition), border-color var(--transition), color var(--transition), box-shadow var(--transition), transform var(--transition), opacity var(--transition);
  white-space: nowrap;
}
.btn-primary {
  background: var(--accent);
  color: #0d0d0f;
}
.btn-primary:hover { background: var(--accent-2); }
.btn-secondary {
  background: var(--bg-3);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--bg-4); }
.btn-danger {
  background: transparent;
  color: var(--danger);
  border: 1px solid var(--danger);
}
.btn-danger:hover { background: rgba(224,91,91,.1); }

.btn-sm { padding: .35rem .75rem; font-size: var(--type-control); }

/* ── Filtres ──────────────────────────────────────────────── */
.filter-bar { display: none; }

/* ── FAB Filtres ──────────────────────────────────────────── */
.topbar-filter-btn {
  display: flex;
  align-items: center;
  gap: .45rem;
  padding: .45rem .9rem;
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 99px;
  color: var(--text-2);
  font-size: var(--type-control);
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--transition), color var(--transition), border-color var(--transition);
}
.topbar-filter-btn:hover { background: var(--bg-4); color: var(--text); }
.topbar-filter-btn.has-filter {
  background: var(--accent-glow);
  border-color: var(--accent);
  color: var(--accent);
}
.filter-fab-badge {
  background: var(--accent);
  color: #0d0d0f;
  font-size: var(--type-caption);
  font-weight: 700;
  border-radius: 99px;
  padding: .1em .45em;
  line-height: 1.4;
}
.filter-chip {
  padding: .3rem .85rem;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: var(--bg-2);
  color: var(--text-2);
  font-size: var(--type-control);
  font-weight: 600;
  cursor: pointer;
  transition: background-color var(--transition), border-color var(--transition), color var(--transition), box-shadow var(--transition), transform var(--transition);
}
.filter-chip:hover { border-color: var(--accent); color: var(--accent); }
.filter-chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #0d0d0f;
  font-weight: 700;
}
.filter-select {
  padding: .3rem .75rem;
  height: 34px;
  font-size: var(--type-control);
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 99px;
  color: var(--text-2);
  font-weight: 600;
  width: auto;
  cursor: pointer;
}

/* ── Grille cartes ────────────────────────────────────────── */
#cards-grid {
  margin-top: .75rem;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: .8rem;
  transition: gap .2s;
}

/* ── Carte média ──────────────────────────────────────────── */
.media-card {
  background: transparent;
  border-radius: var(--radius);
  overflow: visible;
  cursor: pointer;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: .4rem;
  animation: cardAppear .22s var(--ease-out) both;
}
@keyframes cardAppear {
  from { opacity: 0; transform: translateY(8px) scale(.98); }
  to   { opacity: 1; transform: none; }
}

/* Transition grille au changement de filtre */
#cards-grid.filter-transition {
  animation: gridRefresh .18s var(--ease-out) both;
}
@keyframes gridRefresh {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}
.card-cover {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  background: var(--bg-3);
  border-radius: var(--radius);
  flex-shrink: 0;
  transition: transform .2s var(--ease-spring), box-shadow .2s, filter .2s, opacity .4s ease;
}
.media-card.is-wishlist .card-cover,
.media-card.is-wishlist .card-cover-placeholder,
.media-card.is-paused .card-cover,
.media-card.is-paused .card-cover-placeholder,
.media-card.is-dropped .card-cover,
.media-card.is-dropped .card-cover-placeholder {
  opacity: .45;
  filter: saturate(0.2);
}
.card-cover-placeholder {
  width: 100%;
  aspect-ratio: 2/3;
  background: var(--bg-3);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  color: var(--text-3);
  flex-shrink: 0;
}

/* ── Bas de carte : note + cœur ──────────────────────────── */
.card-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .25rem;
  padding: 0 .1rem;
  min-height: 1rem;
}
.rating-score {
  display: inline-flex;
  align-items: center;
  color: var(--accent);
  font-size: var(--type-control);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: .01em;
  line-height: 1;
  white-space: nowrap;
}
.rating-unrated {
  color: var(--text-3);
  font-size: var(--type-control);
  font-weight: 600;
}
.card-rating {
  font-size: var(--type-label);
  color: var(--accent);
}

/* Shimmer continu sur 10/10 */
.card-rating.is-perfect {
  background: linear-gradient(90deg, var(--accent) 0%, #fff8e1 40%, var(--accent-2) 60%, var(--accent) 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: starShimmer 1.1s var(--ease-out) 1 both;
}
@keyframes starShimmer {
  from { background-position: 200% center; }
  to   { background-position: -200% center; }
}
.card-heart {
  font-size: var(--type-lead);
  color: var(--brand-coral);
  line-height: 1;
  flex-shrink: 0;
  transition: transform var(--motion-fast) var(--ease-spring);
}
@media (hover: hover) and (pointer: fine) {
  .media-card:hover .card-heart { animation: heartPop .42s var(--ease-spring) 1; }
}

/* ── Badges ───────────────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: .25rem;
  padding: .15rem .5rem;
  border-radius: 99px;
  font-size: var(--type-caption);
  font-weight: 700;
  letter-spacing: .04em;
}
.badge-game  { background: var(--brand-teal-glow); color: var(--brand-teal); }
.badge-movie { background: var(--brand-coral-glow); color: var(--brand-coral); }
.badge-tv    { background: var(--brand-blue-glow); color: var(--brand-blue); }
.badge-book  { background: var(--brand-gold-glow); color: var(--brand-gold); }
.badge-wishlist  { background: rgba(96,96,112,.15); color: var(--text-3); }
.badge-playing   { background: rgba(91,141,238,.15); color: var(--game); }
.badge-finished  { background: var(--brand-teal-glow); color: var(--brand-teal); }
.badge-paused    { background: rgba(255,180,50,.15);  color: var(--warn); }
.badge-dropped   { background: rgba(220,60,60,.15);   color: var(--danger); }

/* ── Étoiles / note ───────────────────────────────────────── */

.rating-stars {
  display: flex;
  gap: .1rem;
}
.star-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
  width: 28px;
  height: 28px;
}
.star-svg {
  pointer-events: none;
  display: block;
}
.star-half-zone, .star-full-zone {
  position: absolute;
  top: 0;
  height: 100%;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  z-index: 1;
}
.star-half-zone { left: 0; width: 50%; }
.star-full-zone { right: 0; width: 50%; }

/* ── Empty state ──────────────────────────────────────────── */
.empty-state {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 5rem 2rem;
  text-align: center;
  color: var(--text-3);
  gap: 1rem;
}
.empty-state .empty-icon { font-size: 4rem; }
.empty-state h3 { color: var(--text-2); font-family: var(--font-body); font-size: var(--type-lead); font-weight: 600; }
.empty-state p { font-size: var(--type-body); max-width: 280px; }

/* ── Modal ────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.modal {
  --modal-max-width: 560px;
  --modal-padding-left: 1.5rem;
  --modal-padding-right: 1.5rem;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  width: 100%;
  max-width: var(--modal-max-width);
  max-height: 92vh;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.5rem var(--modal-padding-right) 0 var(--modal-padding-left);
  margin-bottom: 1.25rem;
}
.modal-header h3 {
  font-family: var(--font-body);
  font-size: var(--type-title-sm);
  font-weight: 800;
  letter-spacing: -.02em;
}
.modal-body { padding: 0 var(--modal-padding-right) 1.5rem var(--modal-padding-left); display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; }

/* Confirmation cohérente avec les autres feuilles Kulturo. */
.confirm-overlay { z-index: 1100; background: rgba(0,0,0,.72); }
.confirm-modal { --modal-max-width: 400px; }
.confirm-modal-header { align-items: flex-start; }
.confirm-modal-heading { min-width: 0; }
.confirm-modal-heading > span {
  display: block;
  margin-bottom: .18rem;
  color: var(--accent);
  font-size: var(--type-micro);
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.confirm-modal-heading h3 { margin: 0; }
.confirm-modal-body {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr);
  align-items: center;
  gap: .8rem;
  padding-top: .15rem;
}
.confirm-modal-body p { margin: 0; color: var(--text-2); font-size: var(--type-control); line-height: 1.55; }
.confirm-modal-symbol {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border: 1px solid color-mix(in srgb, var(--danger) 55%, var(--border));
  border-radius: 12px;
  background: color-mix(in srgb, var(--danger) 12%, var(--bg-3));
  color: var(--danger);
  font-size: var(--type-lead);
  font-weight: 850;
}
.confirm-modal-footer { justify-content: flex-end; }
.confirm-modal-footer .btn { min-width: 104px; justify-content: center; }
.modal-footer {
  display: flex;
  gap: .5rem;
  justify-content: flex-end;
  padding: 1rem var(--modal-padding-right) 1rem var(--modal-padding-left);
  border-top: 1px solid var(--border);
}

/* ── Form groups ──────────────────────────────────────────── */
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
.form-group { display: flex; flex-direction: column; gap: .35rem; }
.form-group label { font-size: var(--type-control); font-weight: 600; color: var(--text-2); }

/* ── API search dans modal ────────────────────────────────── */
.api-search-wrap { position: relative; }
.api-results {
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  z-index: 50;
  max-height: 240px;
  overflow-y: auto;
  box-shadow: var(--shadow);
}
.api-result-item {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .6rem .75rem;
  cursor: pointer;
  transition: background var(--transition);
  border-bottom: 1px solid var(--border);
  width: 100%;
  border-top: 0;
  border-left: 0;
  border-right: 0;
  background: transparent;
  color: var(--text);
  text-align: left;
}
.api-result-item:last-child { border-bottom: none; }
.api-result-item:hover { background: var(--bg-4); }
.api-result-thumb {
  width: 36px;
  height: 54px;
  object-fit: cover;
  border-radius: var(--radius);
  background: var(--bg-4);
  flex-shrink: 0;
}
.api-result-info { flex: 1; min-width: 0; }
.api-result-title { font-size: var(--type-body); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.api-result-sub   { font-size: var(--type-label); color: var(--text-3); }

/* ── Dashboard stats ──────────────────────────────────────── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: .6rem;
  margin-bottom: 0;
}
.stat-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: .9rem .85rem;
  display: flex;
  flex-direction: column;
  gap: .2rem;
}
.stat-card .stat-value {
  font-family: var(--font-body);
  font-size: var(--type-title-lg);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--text-1);
  line-height: 1;
}
.stat-card.accent .stat-value { color: var(--accent); }
.stat-card .stat-label { font-size: var(--type-label); color: var(--text-3); font-weight: 500; margin-top: .1rem; }

/* ── Charts ───────────────────────────────────────────────── */
.charts-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .75rem;
  margin-bottom: 0;
}
.chart-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem;
}
.chart-card-compact {
  padding: 1rem;
}
.chart-card-compact .top-row {
  padding: .25rem .3rem;
}
.chart-card-compact .top-cover { width: 28px; height: 38px; }
.chart-card-compact .top-title { font-size: var(--type-control); }
.chart-card h3 { font-size: var(--type-label); font-weight: 700; color: var(--text-3); margin-bottom: .875rem; font-family: var(--font-body); text-transform: uppercase; letter-spacing: .08em; }
.bar-chart { display: flex; flex-direction: column; gap: .55rem; }
.bar-item { display: flex; flex-direction: column; gap: .2rem; }
.bar-item-label {
  display: flex;
  justify-content: space-between;
  font-size: var(--type-label);
  color: var(--text-2);
}
.bar-track {
  height: 5px;
  background: var(--bg-4);
  border-radius: 99px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 99px;
  transition: width .6s cubic-bezier(.4,0,.2,1);
}

/* ── Auth page ────────────────────────────────────────────── */
#page-auth {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-height: 100dvh;
  padding: calc(2rem + var(--safe-top)) calc(2rem + var(--safe-right)) calc(2rem + var(--safe-bottom)) calc(2rem + var(--safe-left));
  background: var(--bg);
}
.auth-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 2.5rem;
  width: 100%;
  max-width: 380px;
  box-shadow: var(--shadow-lg);
}
.auth-card .logo {
  font-family: var(--font-display);
  font-size: var(--type-metric-md);
  font-weight: 900;
  color: var(--accent);
  text-align: center;
  margin-bottom: .25rem;
}
.auth-card .tagline {
  text-align: center;
  font-size: var(--type-body);
  color: var(--text-3);
  margin-bottom: 2rem;
}
.auth-title {
  margin: 0 0 1.25rem;
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--type-lead);
  font-weight: 750;
  text-align: center;
}
.auth-form { display: flex; flex-direction: column; gap: 1rem; }
.auth-divider {
  text-align: center;
  font-size: var(--type-label);
  color: var(--text-3);
  margin: .5rem 0;
}
/* ── Toast ────────────────────────────────────────────────── */
#toast-container {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  z-index: 999;
  display: flex;
  flex-direction: column;
  gap: .5rem;
  pointer-events: none;
}
.toast {
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: .75rem 1.1rem;
  font-size: var(--type-body);
  font-weight: 500;
  box-shadow: var(--shadow);
  animation: toastIn .25s var(--ease-spring) both;
  max-width: 300px;
  display: flex;
  align-items: center;
  gap: .5rem;
  pointer-events: auto;
}
.toast.removing { animation: toastOut .2s var(--ease-smooth) both; }
.toast.is-repeated { animation: toastRepeat .24s var(--ease-spring); }
.toast.success { border-color: var(--success); color: var(--success); }
.toast.error   { border-color: var(--danger);  color: var(--danger); }
.toast.info    { border-color: var(--accent);  color: var(--accent); }
.toast-copy { color: inherit; min-width: 0; }
.toast-action {
  appearance: none;
  border: 0;
  border-left: 1px solid color-mix(in srgb, currentColor 35%, transparent);
  background: transparent;
  color: inherit;
  font: inherit;
  font-weight: 800;
  padding: .15rem 0 .15rem .75rem;
  margin-left: .2rem;
  cursor: pointer;
  white-space: nowrap;
}
.toast-action:hover { text-decoration: underline; }
.toast-action:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; border-radius: .2rem; }
.toast-action:disabled { opacity: .55; cursor: wait; }
@keyframes toastIn  { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to   { opacity: 0; transform: translateX(20px); } }
@keyframes toastRepeat {
  50% { transform: translateX(-3px) scale(1.015); border-color: currentColor; }
}

/* ── Spinner ──────────────────────────────────────────────── */
.spinner {
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .6s linear infinite;
  display: inline-block;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Responsive (tablet 681–900px handled separately below) ── */
@media (max-width: 768px) {
  .form-row { grid-template-columns: 1fr; }
}
/* Suppression de l'ancienne règle 480px — gérée dans le bloc 680px consolidé */

/* ── Toggle switch ────────────────────────────────────────── */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  padding: .5rem 0;
}
.toggle-label {
  font-size: var(--type-body);
  font-weight: 500;
  color: var(--text-2);
}
.toggle-switch {
  position: relative;
  display: inline-flex;
  align-items: center;
}
.toggle-switch input {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
}
.toggle-track {
  width: 40px;
  height: 22px;
  background: var(--bg-4);
  border: 1px solid var(--border-2);
  border-radius: 99px;
  display: flex;
  align-items: center;
  padding: 2px;
  transition: background var(--transition), border-color var(--transition);
  cursor: pointer;
}
.toggle-thumb {
  width: 16px;
  height: 16px;
  background: var(--text-3);
  border-radius: 50%;
  transition: transform var(--transition), background var(--transition);
}
.toggle-switch input:checked ~ .toggle-track {
  background: var(--accent-glow);
  border-color: var(--accent);
}
.toggle-switch input:checked ~ .toggle-track .toggle-thumb {
  transform: translateX(18px);
  background: var(--accent);
}
.favorite-toggle:has(input:checked) .toggle-label { color: var(--brand-coral); }
.favorite-toggle .toggle-switch input:checked ~ .toggle-track {
  border-color: var(--brand-coral);
  background: var(--brand-coral-glow);
}
.favorite-toggle .toggle-switch input:checked ~ .toggle-track .toggle-thumb { background: var(--brand-coral); }

/* ── Details / advanced section ──────────────────────────── */
.edit-primary-view {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.edit-modal .modal-header h3 { flex: 1; }
.edit-details-back,
.edit-title-details,
.edit-details-trigger { display: none; }
.advanced-details {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.advanced-summary {
  display: flex;
  align-items: center;
  gap: .5rem;
  padding: .65rem .9rem;
  cursor: pointer;
  font-size: var(--type-control);
  font-weight: 600;
  color: var(--text-2);
  user-select: none;
  list-style: none;
  transition: background var(--transition);
}
.advanced-summary::-webkit-details-marker { display: none; }
.advanced-summary::before {
  content: "›";
  font-size: var(--type-lead);
  color: var(--text-3);
  transition: transform var(--transition);
  display: inline-block;
}
details[open] .advanced-summary::before { transform: rotate(90deg); }
.advanced-summary:hover { background: var(--bg-3); }
.advanced-hint {
  font-weight: 400;
  color: var(--text-3);
  font-size: var(--type-label);
}
.advanced-body {
  padding: .75rem .9rem;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: .75rem;
}

/* ── Prochaines sorties ───────────────────────────────────── */
.upcoming-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  margin-bottom: .85rem;
}
.upcoming-toolbar-main,
.upcoming-type-switch {
  display: flex;
  align-items: center;
  gap: .4rem;
}
.upcoming-type-btn {
  flex-shrink: 0;
  min-height: 38px;
  padding: .48rem .95rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--bg-2);
  color: var(--text-2);
  font-size: var(--type-label);
  font-weight: 650;
  white-space: nowrap;
  transition: background var(--transition), border-color var(--transition), color var(--transition), transform .12s;
}
.upcoming-type-btn:hover {
  border-color: var(--border-2);
  color: var(--text);
}
.upcoming-type-btn:active { transform: scale(.96); }
.upcoming-type-btn.active {
  border-color: var(--accent);
  background: var(--accent);
  color: #0d0d0f;
  font-weight: 750;
}
.upcoming-refresh-btn {
  min-height: 38px;
  justify-content: center;
}
.upcoming-refresh-icon {
  display: inline-block;
  font-size: var(--type-lead);
  line-height: 1;
}
.upcoming-refresh-btn.is-loading .upcoming-refresh-icon {
  animation: spin .7s linear infinite;
}
.upcoming-refresh-btn:disabled { cursor: wait; opacity: .6; }
.upcoming-genre-filter {
  display: flex;
  align-items: center;
  gap: .55rem;
  min-width: 220px;
  min-height: 40px;
  padding-left: .8rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--bg-2);
  color: var(--text-3);
  transition: border-color var(--transition), background var(--transition);
}
.upcoming-genre-filter > span {
  flex-shrink: 0;
  font-size: var(--type-label);
  font-weight: 750;
  letter-spacing: .05em;
  text-transform: uppercase;
}
.upcoming-genre-filter select {
  min-width: 0;
  height: 38px;
  padding: .35rem 2rem .35rem 0;
  border: 0;
  border-radius: 999px;
  background: transparent;
  box-shadow: none;
  color: var(--text-2);
  font-size: var(--type-control);
  font-weight: 600;
}
.upcoming-genre-filter:focus-within { border-color: var(--accent); }
.upcoming-genre-filter.has-filter {
  border-color: var(--accent);
  background: var(--accent-glow);
}
.upcoming-genre-filter.has-filter > span,
.upcoming-genre-filter.has-filter select { color: var(--accent); }
.upcoming-genre-filter select:disabled { cursor: default; opacity: .6; }
.upcoming-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1.25rem;
}
.upcoming-card {
  cursor: pointer;
  height: 100%;
}
.upcoming-card .card-body {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
  padding: .15rem .1rem 0;
}
.upcoming-card .card-title {
  color: var(--text);
  font-size: var(--type-body);
  font-weight: 700;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.upcoming-card .card-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .35rem;
  margin-top: .45rem;
}
.upcoming-region-label {
  display: inline-flex;
  align-items: center;
  min-height: 21px;
  padding: .18rem .42rem;
  border: 1px solid color-mix(in srgb, var(--accent) 24%, var(--border));
  border-radius: var(--radius-pill);
  background: color-mix(in srgb, var(--accent) 7%, transparent);
  color: var(--text-3);
  font-size: var(--type-micro);
  font-weight: 650;
  line-height: 1;
  white-space: nowrap;
}
.upcoming-card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.badge-upcoming {
  color: var(--accent);
  border: 1px solid rgba(200, 169, 110, .35);
  background: rgba(200, 169, 110, .08);
}
.upcoming-loading {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  padding: 4rem 2rem;
  color: var(--text-3);
  font-size: var(--type-body);
}
.upcoming-progress {
  display: flex;
  align-items: center;
  gap: .65rem;
  padding: .65rem .85rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg-2);
  color: var(--text-3);
  font-size: var(--type-label);
  animation: upcomingIn var(--motion-fast) var(--ease-out) both;
}
.upcoming-progress .spinner {
  width: 16px;
  height: 16px;
  border-width: 2px;
  flex: 0 0 auto;
}
.upcoming-intro {
  color: var(--text-3);
  font-size: var(--type-body);
  margin-bottom: 1.5rem;
}
.upcoming-cover-wrap {
  position: relative;
}
.release-countdown {
  position: absolute;
  top: .6rem;
  right: .6rem;
  padding: .28rem .5rem;
  border-radius: 999px;
  background: rgba(13, 13, 15, .82);
  color: var(--accent);
  border: 1px solid rgba(200, 169, 110, .35);
  backdrop-filter: blur(8px);
  font-size: var(--type-caption);
  font-weight: 700;
  letter-spacing: .02em;
}
.release-date {
  margin-top: .55rem;
  color: var(--accent);
  font-size: var(--type-label);
  font-weight: 600;
  text-transform: capitalize;
}
.upcoming-secondary {
  overflow: hidden;
  margin-top: .35rem;
  color: var(--text-2);
  font-size: var(--type-caption);
  line-height: 1.35;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.upcoming-desc {
  font-size: var(--type-label);
  color: var(--text-3);
  margin-top: .45rem;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.upcoming-card-actions { margin-top: auto; padding-top: .75rem; }
.upcoming-wishlist-btn { width: 100%; }
.upcoming-wishlist-btn:disabled {
  cursor: default;
  opacity: .65;
}

/* ── Fiche détaillée ──────────────────────────────────────── */
.detail-modal {
  --modal-max-width: 640px;
  overflow: hidden;
  padding: 0;
  border-radius: var(--radius-xl);
  isolation: isolate;
}

/* ── Backdrop ── */
.detail-backdrop {
  position: relative;
  height: 200px;
  background: var(--bg-3);
  overflow: hidden;
  flex-shrink: 0;
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  transform: translateZ(0); /* force GPU layer — clips children on Safari/Chrome */
}
.detail-backdrop.has-backdrop {
  height: 240px;
}
.detail-backdrop-gradient {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom,
    rgba(0,0,0,.35) 0%,
    rgba(0,0,0,.65) 60%,
    rgba(13,13,15,1) 100%);
  z-index: 1;
}
/* Fallback poster flou — via ::before pour ne pas flouter les enfants */
.detail-backdrop.has-fallback {
  background: none !important;
}
.detail-backdrop.has-fallback::before {
  content: '';
  position: absolute;
  inset: -12%;
  background-image: var(--fallback-img);
  background-size: cover;
  background-position: center;
  filter: blur(22px) saturate(1.5) brightness(.85);
  z-index: 0;
}
.detail-close-btn {
  position: absolute;
  top: .85rem;
  right: .85rem;
  z-index: 10;
  background: rgba(0,0,0,.45);
  backdrop-filter: blur(6px);
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.15);
  color: #fff;
}
.detail-close-btn:hover { background: rgba(0,0,0,.7); }
.detail-backdrop-content {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  z-index: 2;
  display: flex;
  align-items: flex-end;
  gap: 1rem;
  padding: 1rem 1.25rem;
}
.detail-poster {
  width: 80px;
  min-width: 80px;
  height: 120px;
  object-fit: cover;
  border-radius: calc(var(--radius) - 2px);
  box-shadow: 0 4px 20px rgba(0,0,0,.6);
  flex-shrink: 0;
}
.detail-poster-placeholder {
  width: 80px;
  height: 120px;
  background: var(--bg-2);
  border-radius: calc(var(--radius) - 2px);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--type-metric-md);
  flex-shrink: 0;
}
.detail-backdrop-info {
  flex: 1;
  min-width: 0;
}
.detail-title {
  font-size: var(--type-title-md);
  font-weight: 800;
  line-height: 1.16;
  letter-spacing: -.022em;
  overflow-wrap: anywhere;
  text-wrap: balance;
  margin-bottom: .3rem;
  font-family: var(--font-display);
  color: #fff;
  text-shadow: 0 1px 8px rgba(0,0,0,.8);
}
.detail-rating {
  margin-bottom: .4rem;
}
.detail-rating .rating-score {
  color: var(--brand-gold);
  font-size: var(--type-body);
}
.detail-badges {
  display: flex;
  align-items: center;
  gap: .35rem;
  flex-wrap: wrap;
}
.detail-fav {
  color: var(--brand-coral);

/* ── Body ── */

  flex-direction: column;

}
.detail-meta-label {

}

.detail-meta-history {
  margin-top: .2rem;
  padding-top: .75rem;

}
/* ── Animation nouvelle carte ─────────────────────────────── */
@keyframes cardFlash {

  40%  { box-shadow: 0 0 0 8px transparent; }
  100% { transform: scale(1); }
}
.card-flash {
  animation: cardFlash .6s ease-out forwards;
}

/* ── Bouton ghost ─────────────────────────────────────────── */
.btn-ghost {
  background: transparent;
  border: 1px solid var(--border-2);
  color: var(--text-3);
  border-radius: var(--radius);
  padding: .3rem .55rem;
  font-size: var(--type-control);
  cursor: pointer;
  transition: background .15s, color .15s;
}
.btn-ghost:hover {
  background: var(--bg-3);
  color: var(--text-1);
}

/* ── Synopsis fiche détaillée ─────────────────────────────── */
.detail-synopsis {
  background: var(--bg-3);
  border-radius: var(--radius);
  padding: .75rem;
  font-size: var(--type-body);
  color: var(--text-2);

  margin-bottom: .75rem;
}

/* ── Liens externes fiche détaillée ──────────────────────── */
.detail-ext-link {
  text-decoration: none;
  font-size: var(--type-label);
  padding: .3rem .6rem;
  opacity: .85;
  transition: opacity var(--transition);
}
.detail-ext-link:hover { opacity: 1; }

/* ── Vue liste ────────────────────────────────────────────── */
/* ── Profil / Stats ───────────────────────────────────────── */
/* ── Profile redesign ─────────────────────────────────────── */
.profile-section {
  margin-bottom: 1.5rem;
}
.profile-section-title {
  font-size: var(--type-control);
  font-weight: 700;
  color: var(--text-3);
  margin-bottom: .875rem;
  font-family: var(--font-body);
  text-transform: uppercase;
  letter-spacing: .08em;
}
.stat-card.accent { border-color: var(--accent); }

/* Graphique mensuel */
.month-chart {
  display: flex;
  align-items: flex-end;
  gap: .35rem;
  height: 100px;
  padding-bottom: 1.5rem;
  position: relative;
}
.month-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
  position: relative;
}
.month-bar-wrap {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: flex-end;
}
.month-bar {
  width: 100%;
  background: var(--accent);
  border-radius: var(--radius) var(--radius) 0 0;
  min-height: 3px;
  transition: height .3s ease;
}
.month-label {
  font-size: var(--type-caption);
  color: var(--text-3);
  margin-top: .25rem;
  text-align: center;
}
.month-count {
  font-size: var(--type-caption);
  color: var(--accent);
  font-weight: 700;
  position: absolute;
  top: -1rem;
  text-align: center;
  width: 100%;

/* ── Histogramme des notes ────────────────────────────────── */
.rating-hist-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 1rem;
  flex-wrap: wrap;
  gap: .5rem;
}
.rating-hist-meta {
  display: flex;
  gap: .75rem;
}
.rating-hist-total {
  font-size: var(--type-control);
  color: var(--text-3);
}
.rating-hist-avg {
  font-size: var(--type-control);
  color: var(--text-2);
}
.rating-hist-avg strong {
  color: var(--accent);
  font-weight: 700;
}
.rating-hist {
  display: flex;
  align-items: flex-end;
  gap: .35rem;
  height: 80px;
}
.rating-hist-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  height: 100%;
  position: relative;
  cursor: default;
  gap: .25rem;
}
.rating-hist-col:hover .rating-hist-bar { opacity: 1; }
.rating-hist-col:hover .rating-hist-count { color: var(--accent); }
.rating-hist-count {
  font-size: var(--type-caption);
  color: var(--text-3);
  font-weight: 600;
  line-height: 1;
  min-height: .8rem;
  transition: color .15s;
}
.rating-hist-bar {
  width: 100%;
  background: var(--accent);
  border-radius: var(--radius) var(--radius) 0 0;
  opacity: .35;
  transition: opacity .15s, height .4s cubic-bezier(.4,0,.2,1);
  flex-shrink: 0;
}
.rating-hist-bar.peak { opacity: 1; }

/* Légende gauche / droite */
.rating-hist-legend {
  display: flex;
  justify-content: space-between;
  margin-top: .5rem;
  font-size: var(--type-label);
  color: var(--text-3);
  font-weight: 500;
}

/* Top liste */
.top-list { display: flex; flex-direction: column; gap: .5rem; }
.top-row {
  display: flex;
  align-items: center;
  gap: .6rem;
  cursor: pointer;
  padding: .3rem .4rem;
  border-radius: var(--radius);
  transition: background .15s;
}
.top-row:hover { background: var(--bg-3); }
.top-rank { font-size: var(--type-label); color: var(--text-3); min-width: 1rem; text-align: center; font-weight: 700; }
.top-cover { width: 32px; height: 42px; object-fit: cover; border-radius: var(--radius); }
.top-cover-placeholder { display:flex;align-items:center;justify-content:center;background:var(--bg-3);font-size:var(--type-lead); }
.top-title { flex: 1; font-size: var(--type-control); font-weight: 700; color: var(--text-1); }
.top-rating { font-size: var(--type-label); color: var(--accent); font-weight: 700; white-space: nowrap; }

/* Bouton vue toggle */
.btn-icon-only {
  width: 34px;
  height: 34px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--type-title-sm);
}

/* ============================================================
   ANIMATIONS & MICRO-INTERACTIONS
   ============================================================ */

/* ── Transitions globales enrichies ──────────────────────── */
:root {
  --ease-spring: cubic-bezier(.2,.85,.25,1);
  --ease-smooth: cubic-bezier(.2,.8,.2,1);
  --ease-out:    cubic-bezier(0,0,.2,1);
  --transition:  var(--motion-base) var(--ease-smooth);
}

/* Transitions limitées aux éléments interactifs : rendu plus stable et cohérent. */
:where(button, a, input, select, textarea, .card-cover, .modal, .modal-overlay, .nav-item, .filter-chip) {
  transition-property: background-color, border-color, color, opacity;
  transition-duration: var(--motion-base);
  transition-timing-function: var(--ease-smooth);
}
/* Sauf les éléments qui ont des transitions spécifiques */
.media-card, .btn, .nav-item, .modal, .modal-overlay,
.rating-stars button, .api-result-item,
.month-bar, .bar-fill, .top-row, input, select, textarea {
  transition-property: background-color, border-color, color, box-shadow, opacity, transform;
  transition-duration: var(--motion-base);
  transition-timing-function: var(--ease-smooth);
}

/* ── Page transitions — fade + slide ─────────────────────── */
.page { display: none; }
.page.active {
  display: block;
  animation: pageIn var(--motion-base) var(--ease-out) both;
}
@keyframes pageIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Skeleton loader ──────────────────────────────────────── */
@keyframes skeletonShimmer {
  0%   { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}
.skeleton {
  background: linear-gradient(90deg,
    var(--bg-3) 25%,
    var(--bg-4) 50%,
    var(--bg-3) 75%);
  background-size: 400px 100%;
  animation: skeletonShimmer 1.4s ease-in-out infinite;
  border-radius: var(--radius);
}
.skeleton-card {
  min-width: 0;
  align-self: start;
  border-radius: var(--radius);
  overflow: hidden;
}
.skeleton-cover {
  width: 100%;
  aspect-ratio: 2/3;
}

/* ── Modal — entrée spring ────────────────────────────────── */
.modal-overlay {
  animation: overlayIn .2s var(--ease-smooth) both;
}
@keyframes overlayIn {
  from { opacity: 0; backdrop-filter: blur(0px); }
  to   { opacity: 1; backdrop-filter: blur(6px); }
}
.modal {
  animation: modalIn .3s ease both;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.modal-overlay.is-closing {
  pointer-events: none;
  animation: overlayOut .18s var(--ease-smooth) both;
}
.modal-overlay.is-closing .modal {
  animation: modalOut .18s var(--ease-smooth) both;
}
@keyframes overlayOut {
  from { opacity: 1; backdrop-filter: blur(6px); }
  to   { opacity: 0; backdrop-filter: blur(0); }
}
@keyframes modalOut {
  from { opacity: 1; transform: translateY(0) scale(1); }
  to   { opacity: 0; transform: translateY(14px) scale(.985); }
}

/* ── Boutons — ripple + press ─────────────────────────────── */
.btn {
  position: relative;
  overflow: hidden;
  transition: background-color .18s var(--ease-smooth), border-color .18s var(--ease-smooth), color .18s var(--ease-smooth), box-shadow .18s var(--ease-smooth), transform .18s var(--ease-smooth), opacity .18s var(--ease-smooth);
}
.btn:active { transform: scale(.97); }
.btn-primary:hover {
  background: var(--accent-2);
  box-shadow: 0 4px 20px rgba(200,169,110,.3);
}
.btn-secondary:hover {
  background: var(--bg-4);
  border-color: var(--border-2);
}
@keyframes ripple {
  to { transform: scale(4); opacity: 0; }
}
.ripple-effect {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,.15);
  width: 40px;
  height: 40px;
  margin-top: -20px;
  margin-left: -20px;
  animation: ripple .5s var(--ease-out);
  pointer-events: none;
}

/* ── Nav item — transition enrichie ──────────────────────── */
.nav-item {
  transition: background .18s var(--ease-smooth),
              color .18s var(--ease-smooth),
              transform .12s var(--ease-spring);
}
.nav-item:active { transform: scale(.97); }
.nav-item.active { transform: none; }
.nav-badge {
  transition: background .18s, color .18s, transform .2s var(--ease-spring);
}
.nav-badge.bounce {
  animation: badgeBounce .35s var(--ease-spring);
}
@keyframes badgeBounce {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.4); }
  100% { transform: scale(1); }
}

/* ── Étoiles de note — vague ──────────────────────────────── */
.star-full {
  transition: color .12s, transform .15s var(--ease-spring);
}
.star-full:hover { transform: scale(1.3) rotate(-5deg); }

/* ── Cartes prochaines sorties — stagger ─────────────────── */
@keyframes upcomingIn {
  from { opacity: 0; transform: translateY(20px) scale(.95); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.upcoming-card {
  animation: upcomingIn .4s var(--ease-spring) both;
}

/* ── Stat cards ───────────────────────────────────────────── */
.stat-card {
  transition: transform .2s var(--ease-spring), box-shadow .2s;
}
.stat-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow);
}
/* ── Search bar — focus glow ──────────────────────────────── */
.topbar-search-wrap input {
  transition: box-shadow .2s var(--ease-smooth),
              border-color .2s var(--ease-smooth),
              background .2s;
}
.topbar-search-wrap input:focus {
  box-shadow: 0 0 0 3px var(--accent-glow), 0 2px 12px rgba(200,169,110,.1);
}

/* ── Sidebar indicator glide ──────────────────────────────── */
.nav-indicator {
  position: absolute;
  left: .5rem;
  right: .5rem;
  height: 36px;
  background: var(--accent-glow);
  border-radius: var(--radius);
  pointer-events: none;
  transition: top .22s var(--ease-spring), opacity .15s;
  z-index: 0;
}
.nav-item { position: relative; z-index: 1; }

/* ── Filter chips — bounce ────────────────────────────────── */
.filter-chip {
  transition: background-color .18s var(--ease-spring), border-color .18s var(--ease-spring), color .18s var(--ease-spring), box-shadow .18s var(--ease-spring), transform .18s var(--ease-spring);
}
.filter-chip:hover { transform: translateY(-1px); }
.filter-chip:active { transform: scale(.95); }
.filter-chip.active {
  box-shadow: 0 2px 12px rgba(200,169,110,.2);
}


/* ============================================================
   ANIMATIONS AVANCÉES
   ============================================================ */

/* ── Loading bar ──────────────────────────────────────────── */
#loading-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: transparent;
  overflow: hidden;
  pointer-events: none;
}
#loading-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent));
  background-size: 200% 100%;
  animation: shimmerBar 1.5s linear infinite;
  border-radius: 0 var(--radius) var(--radius) 0;
  box-shadow: 0 0 8px var(--accent);
}
@keyframes shimmerBar {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ── Confetti ─────────────────────────────────────────────── */
.confetti-piece {
  position: fixed;
  top: -10px;
  pointer-events: none;
  z-index: 9999;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0%   { transform: translateY(0) rotate(0deg) translateX(0); opacity: 1; }
  70%  { opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg) translateX(calc((var(--drift,1)) * 80px)); opacity: 0; }
}

/* ── Glow pulsant sur coups de cœur ──────────────────────── */
/* ── Contours pulsants cartes ─────────────────────────────── */

  box-shadow: 0 0 0 2px rgba(200,169,110,.72), 0 0 14px 3px rgba(200,169,110,.22);
}

/* ── Mobile (max-width: 680px) — consolidated ─────────────── */
@media (max-width: 680px) {
  .network-status {
    top: calc(var(--safe-top) + var(--topbar-height) + .4rem);
    right: max(.9rem, var(--safe-right));
    width: 30px;
    padding: 0;
    justify-content: center;
  }
  .network-status > span { display: none; }
  /* Layout — une seule colonne */
  #app {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr auto;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: calc(72px + var(--safe-bottom)); /* espace bottom nav + home indicator */
    overflow-x: hidden;
  }

  /* Topbar compact */
  #topbar {
    padding: calc(.6rem + var(--safe-top)) max(.9rem, calc(.5rem + var(--safe-right))) .6rem max(.9rem, calc(.5rem + var(--safe-left)));
    gap: .6rem;
  }
  .topbar-logo { font-size: var(--type-title-sm); }

  /* Sidebar cachée */
  #sidebar { display: none; }
  #main { padding-left: 1rem; }

  /* Main pleine largeur */
  #main {
    height: auto;
    min-height: 0;
    padding: 0 max(1rem, calc(.5rem + var(--safe-right))) 1rem max(1rem, calc(.5rem + var(--safe-left)));
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* Grille mobile équilibrée */
  #cards-grid { grid-template-columns: repeat(3, 1fr); gap: .6rem; }

  /* Page header compact */
  .page-header { margin-bottom: .25rem; }

  /* Filter bar scroll horizontal */
  .filter-bar {
    overflow-x: auto;
    flex-wrap: nowrap;
    padding: .8rem 0;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--bg);
    mask-image: none;
    -webkit-mask-image: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-chip { white-space: nowrap; flex-shrink: 0; }


  /* Modal plein écran en bas */
  .modal-overlay {
    align-items: flex-end;
    padding: 0 var(--safe-right) 0 var(--safe-left);
  }
  .modal {
    max-width: 100%;
    width: 100%;
    max-height: calc(92dvh - var(--safe-top)); /* dvh tient compte du clavier mobile */
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    animation: modalMobileIn .35s ease both;
    display: flex;
    flex-direction: column;
  }
  /* Drag handle visuel */
  .modal::before {
    content: '';
    display: block;
    width: 36px;
    height: 4px;
    background: var(--border-2);
    border-radius: 99px;
    margin: .75rem auto -.25rem;
    flex-shrink: 0;
  }
  .modal-header {
    padding-top: 1rem;
  }
  .modal-body {
    overflow-y: auto;
    flex: 1;
    /* Espace pour le footer fixe + safe area */
    padding-bottom: calc(max(var(--safe-bottom), 12px) + .5rem);
  }
  .modal-footer {
    flex-shrink: 0;
    padding-bottom: calc(max(var(--safe-bottom), 12px) + 1rem);
  }
  @keyframes modalMobileIn {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Detail modal mobile */
  .detail-modal { border-radius: var(--radius-lg) var(--radius-lg) 0 0; }

  .detail-modal::before { display: none; }

  /* Stats grid reste 3 colonnes sur mobile */

    grid-template-columns: repeat(3, 1fr);
    gap: .5rem;
  }
  .stat-card .stat-value { font-size: var(--type-title-md); }

  /* Charts en colonne sur mobile */
  .charts-row { grid-template-columns: 1fr; }

  /* Time badge hint masqué sur mobile */

  /* Prochaines sorties : grille 2 colonnes */
  .upcoming-toolbar {
    position: sticky;
    top: 0;
    z-index: 80;
    flex-direction: column;
    align-items: stretch;
    gap: .5rem;
    margin: 0 0 .8rem;
    padding: .7rem 0 .65rem;
    background: color-mix(in srgb, var(--bg) 95%, transparent);
    border-bottom: 1px solid var(--border);
    -webkit-backdrop-filter: blur(16px);

    min-width: 0;
    gap: .2rem;
    padding: .2rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--bg-2);

  .upcoming-type-btn {
    width: 100%;
    min-height: 36px;
    padding: .45rem .3rem;
    border-color: transparent;
    background: transparent;
    font-size: var(--type-label);
  }
  .upcoming-type-btn.active {
    border-color: var(--accent);
    box-shadow: 0 2px 10px rgba(0, 0, 0, .18);
  }
  .upcoming-refresh-btn {
    width: 42px;
    height: 42px;
    min-height: 42px;
    flex: 0 0 42px;
    padding: 0;
    border-radius: 50%;
  }
  .upcoming-refresh-label { display: none; }
  .upcoming-genre-filter {
    width: 100%;
    min-width: 0;
    min-height: 40px;
    background: var(--bg-2);
  }
  .upcoming-genre-filter select { flex: 1; width: auto; }
  .upcoming-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: .75rem;
  }

  /* Topbar — pas de coupure */
  .topbar-right { flex-shrink: 0; }
  .topbar-search-wrap { min-width: 0; }

  /* Bottom nav visible */
  #bottom-nav {
    display: flex;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--bg-2);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(12px);
    z-index: 150;
    padding: 0 calc(.75rem + var(--safe-right)) var(--safe-bottom) calc(.75rem + var(--safe-left));
    align-items: center;
    justify-content: space-around;
    gap: .25rem;
    min-height: calc(58px + var(--safe-bottom));
    isolation: isolate;
  }
  /* Si WebKit peint momentanément la barre trop haut au lancement, son fond
     continue jusqu'au bord inférieur au lieu de laisser apparaître une bande. */
  #bottom-nav::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    height: 120px;
    background: var(--bg-2);
    pointer-events: none;
  }
  .bottom-nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .2rem;
    border: none;
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    height: 52px;
    border-radius: var(--radius);
    transition: color .18s, background .18s, transform .15s var(--ease-spring);
    font-size: var(--type-caption);
    font-weight: 600;
    letter-spacing: .02em;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
    position: relative;
    z-index: 1;
    min-width: 0;
  }
  .bottom-nav-item > svg,
  .bottom-nav-item > span { pointer-events: none; }
  .bottom-nav-item svg {
    width: 22px;
    height: 22px;
    stroke-width: 1.8;
  }
  .bottom-nav-item:active { transform: scale(.96); }
  .bottom-nav-item { transition: color .2s ease, transform .15s ease; }
  .bottom-nav-item.active { color: var(--accent); }
  .bottom-nav-item.active svg { stroke: var(--accent); }

  .bottom-nav-add {
    background: var(--accent);
    color: #0d0d0f;
    border-radius: 50%;
    width: 46px;
    height: 46px;
    flex: 0 0 46px;
    box-shadow: 0 4px 16px rgba(200,169,110,.4);
  }
  .bottom-nav-add svg { stroke: #0d0d0f; width: 20px; height: 20px; }
  .bottom-nav-add.active { color: #0d0d0f; }

  /* Toast au-dessus du bottom nav — centrés */
  #toast-container {
    bottom: calc(84px + var(--safe-bottom)) !important;
    left: max(1rem, calc(.5rem + var(--safe-left)));
    right: max(1rem, calc(.5rem + var(--safe-right)));
    align-items: center;
  }
  .toast { max-width: 100%; }

  #topbar {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: .6rem;
    padding: calc(.6rem + var(--safe-top)) max(.9rem, calc(.5rem + var(--safe-right))) .6rem max(.9rem, calc(.5rem + var(--safe-left)));
    position: sticky;
  }
  .topbar-logo { font-size: var(--type-title-sm); white-space: nowrap; width: auto; padding-left: 0; }
  .topbar-tagline { display: none; }
  .topbar-search-wrap {
    min-width: 0;
    max-width: none;
    width: 100%;
    margin: 0;
  }
  .topbar-right {
    margin-left: 0;
    flex-shrink: 0;
    padding-right: 0;
  }
  #loading-bar { grid-column: 1 / -1; }

  .badge { font-size: var(--type-caption); padding: .1rem .35rem; }
  .media-card { min-width: 0; }

  .filter-bar {
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    width: 100%;
    max-width: 100vw;
    gap: .4rem;
    padding-bottom: .4rem;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    mask-image: none;
    -webkit-mask-image: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-chip, .filter-select { flex-shrink: 0; }

  #bottom-nav {
    height: calc(72px + var(--safe-bottom));
  }
  /* .bottom-nav-item height already set above */
  .bottom-nav-item svg {
    width: 24px;
    height: 24px;
  }
  .bottom-nav-add {
    width: 50px;
    height: 50px;
    flex: 0 0 50px;
  }
  .bottom-nav-add svg {
    width: 22px;
    height: 22px;
  }
  #app { padding-bottom: calc(72px + var(--safe-bottom)); }
  #toast-container { bottom: calc(84px + var(--safe-bottom)) !important; }

  /* Onglets catégories fixes sous le titre */

  .category-tabs {
    display: flex;
    gap: .4rem;
    margin-bottom: 1rem;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .category-tabs::-webkit-scrollbar { display: none; }
}

/* WebKit retire parfois les safe areas de 100dvh au premier rendu d'une PWA.
   Le verrou s'applique à toutes les largeurs : #main garde son propre scroll
   sans que le shell, la topbar et la navigation se désolidarisent au rebond. */
html.is-standalone,
html.is-standalone body.app-shell-active {
  height: 100vh;
  min-height: 100vh;
}
html.is-standalone body.app-shell-active {
  overflow: hidden;
  overscroll-behavior: none;
}
html.is-standalone body.app-shell-active #app {
  height: 100vh;
  min-height: 100vh;
  overflow: hidden;
  overscroll-behavior: none;
}
html.is-standalone body.app-shell-active #main { overscroll-behavior-y: contain; }

/* Category tabs — global (desktop + mobile) */
.category-tab {
  flex-shrink: 0;
  padding: .3rem .85rem;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: var(--bg-3);
  color: var(--text-2);
  font-size: var(--type-control);
  font-weight: 500;
  cursor: pointer;
  transition: background-color .18s var(--ease-spring), border-color .18s var(--ease-spring), color .18s var(--ease-spring), transform .18s var(--ease-spring);
}
.category-tab.active {
  background: var(--accent);
  color: #0d0d0f;
  border-color: var(--accent);
  font-weight: 700;
}
.category-tab:active { transform: scale(.93); }

/* ── Journal des terminés ─────────────────────────────────── */



/* ── Chronologie du Journal ─────────────────────────────────── */
.activity-date-group { margin-bottom: 1.5rem; }

.activity-date-label {
  font-size: var(--type-label);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-3);
  padding: .4rem 0;
  margin-bottom: .5rem;
  border-bottom: 1px solid var(--border);
}

.activity-row {
  display: flex;
  align-items: center;
  gap: 1rem;
  min-height: 110px;
  padding: .85rem;
  border: 1px solid transparent;
  transition: background var(--transition);
  border-radius: var(--radius);
}
.activity-row + .activity-row { margin-top: .45rem; }

.activity-cover {
  width: 62px;
  height: 92px;
  object-fit: cover;
  border-radius: 10px;
  flex-shrink: 0;
  background: var(--bg-3);
}
.activity-cover-ph {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--type-title-md);
}

.activity-info { flex: 1; min-width: 0; }

.activity-title {
  font-size: var(--type-lead);
  font-weight: 700;
  color: var(--text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: .3rem;
}

.activity-meta {
  display: flex;
  align-items: center;
  gap: .5rem;
  flex-wrap: wrap;
}

.activity-time {
  font-size: var(--type-label);
  color: var(--text-3);
  flex-shrink: 0;
  align-self: flex-start;
  padding-top: .2rem;
}

.detail-footer-actions-readonly { width: 100%; justify-content: flex-end; }

/* ── Page Profil ─────────────────────────────────────────────── */

/* ── Rating tooltip label ────────────────────────────────────── */
.rating-tooltip-label {
  font-size: var(--type-control);
  font-weight: 400;
  color: var(--accent);
  opacity: 0;
  transition: opacity .15s;
  font-style: italic;
}

/* ── Identity hero card ───────────────────────────────────── */
.profile-identity-bar {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  position: relative;
  overflow: hidden;
}
.profile-identity-bar::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), transparent);
  border-radius: 99px 99px 0 0;
}
.profile-avatar-circle {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--bg-3);
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--type-title-sm);
  flex-shrink: 0;
}
.profile-identity-meta {
  flex: 1;
  min-width: 0;
}
.profile-identity-email {
  font-size: var(--type-label);
  color: var(--text-3);
  margin-bottom: .15rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.profile-identity-name {
  font-size: var(--type-lead);
  font-weight: 700;
  color: var(--text-1);
}
.profile-identity-actions {
  display: flex;
  gap: .5rem;
  flex-shrink: 0;
  align-items: center;
}
.profile-username-row {
  display: flex;
  align-items: center;
  gap: .5rem;
  margin-top: .5rem;
}
.profile-username-row input {
  font-size: var(--type-control);
  padding: .3rem .55rem;
  border-radius: var(--radius);
  background: var(--bg-3);
  border: 1px solid var(--border);
  color: var(--text-1);
  width: 130px;
}

/* ── Profile dashboard layout ─────────────────────────────── */
#dashboard-content {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}
#dashboard-content .profile-section {
  margin-bottom: 0;
}

/* ── Year header row ──────────────────────────────────────── */
.profile-year-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: .875rem;
  gap: .75rem;
}
.profile-year-label {
  font-size: var(--type-control);
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .08em;
}
.profile-year-inline {
  font-size: var(--type-control);
  padding: .25rem .5rem;
  border-radius: var(--radius);
  background: var(--bg-3);
  border: 1px solid var(--border);
  color: var(--text-1);
  cursor: pointer;
}

/* ── Section fusionnée Top + Global ──────────────────────── */
.merged-stats-layout {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 0;
}
.merged-col {
  padding: .25rem;
}
.merged-col-top {
  padding-right: 1.25rem;
}
.merged-col-global {
  padding-left: 1.25rem;
}
.merged-divider {
  width: 1px;
  background: var(--border);
  align-self: stretch;
}
@media (max-width: 600px) {
  .merged-stats-layout {
    grid-template-columns: 1fr;
  }
  .merged-divider {
    width: auto;
    height: 1px;
    align-self: auto;
    margin: .75rem 0;
  }
  .merged-col-top { padding-right: 0; }
  .merged-col-global { padding-left: 0; }
}

/* ── Time badge ───────────────────────────────────────────── */
.time-badge {
  display: flex;
  align-items: center;
  gap: .5rem;
  padding: .65rem .9rem;
  background: var(--bg-3);
  border-radius: var(--radius);
  font-size: var(--type-control);
  color: var(--text-2);
  margin-top: .875rem;
}
.time-badge strong {
  color: var(--accent);
  font-weight: 700;
}
.time-badge-hint {
  font-size: var(--type-label);
  color: var(--text-3);
  margin-left: auto;
}

/* ── Star rating ──────────────────────────────────────────── */
:root { --star-empty: var(--border-2); }
#rating-stars { display: flex; gap: 4px; align-items: center; }
.star-wrap {
  position: relative;
  display: inline-flex;
  width: 28px;
  height: 28px;
  cursor: pointer;
}
.star-svg {
  display: block;
  pointer-events: none;
  transform: translateZ(0);
  transition: transform .14s var(--ease-spring);
}
.star-svg polygon { transition: fill .12s ease; }
.star-zone {
  position: absolute;
  top: 0; height: 100%;
  background: none; border: none; padding: 0; cursor: pointer;
}
.star-zone-half { left: 0; width: 50%; }
.star-zone-full { right: 0; width: 50%; }

/* Le grossissement ne s'applique qu'aux véritables pointeurs de souris :
   Safari iOS ne peut ainsi plus conserver une étoile agrandie après un tap. */
@media (hover: hover) and (pointer: fine) {
  .star-wrap:hover .star-svg { transform: scale(1.08); }
}
@media (prefers-reduced-motion: reduce) {
  .star-svg,
  .star-svg polygon { transition: none; }
}

/* ── Modal type tabs ─────────────────────────────────────── */
.modal-search-unified { gap: .75rem; }

.modal-type-tabs {
  display: flex;
  margin-bottom: .25rem;
}

.modal-type-tab {
  flex: 1;
  cursor: pointer;
  transition: background-color .15s ease, border-color .15s ease, color .15s ease, transform .15s ease;
  text-align: center;
}

.modal-type-tab:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ── Filter bar fusionnée ───────────────────────────────────── */
.filter-bar {
  display: flex;
  align-items: center;
  gap: .5rem;
  padding: .4rem var(--content-px);
  overflow: hidden;
}
.filter-bar .category-tabs {
  flex: 1;
  overflow-x: auto;
  scrollbar-width: none;
  display: flex;
  gap: .35rem;
  padding: .1rem 0;
  -webkit-overflow-scrolling: touch;
}
.filter-bar .category-tabs::-webkit-scrollbar { display: none; }
.filter-actions { flex-shrink: 0; }

/* btn-filter-toggle hérite du style category-tab */
.btn-filter-toggle {
  display: inline-flex;
  align-items: center;
  gap: .3rem;
  white-space: nowrap;
}
.btn-filter-toggle.has-filter { border-color: var(--accent) !important; color: var(--accent) !important; background: color-mix(in srgb, var(--accent) 15%, transparent) !important; }

/* Modal filtres */
.filter-modal {
  --modal-max-width: 420px;
}
.filter-modal-section {
  margin-bottom: 1.5rem;
}
.filter-modal-section:last-child { margin-bottom: 0; }
.filter-modal-label {
  font-size: var(--type-label);
  font-weight: 700;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: .6rem;
}
.filter-modal-chips {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
}
.filter-active-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  background: var(--accent);
  color: #0d0d0f;
  border-radius: 99px;
  font-size: var(--type-label);
  font-weight: 800;
  margin-left: .35rem;
  vertical-align: middle;
}


/* Couche backdrop qui fade par-dessus le fallback */
.detail-backdrop-layer {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center top;
  z-index: 0;
  transition: opacity .6s ease;
}

/* ── Sections fiche détail enrichie ────────────────────────── */
.detail-section {
  display: flex;
  flex-direction: column;
  gap: .4rem;
}
.detail-section-label {
  font-size: var(--type-label);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-3);
}
.detail-section-content { }
.detail-synopsis-slot:empty,
.detail-info-slot:empty { display: none; }
.detail-info-slot {
  display: flex;
  flex-direction: column;
  gap: .75rem;
}
.detail-synopsis-slot.is-transitioning {
  display: grid;
}
.detail-synopsis-slot.is-transitioning > .detail-section {
  grid-area: 1 / 1;
}
.detail-synopsis-skeleton {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: calc(1.7em * 4 + 1.45rem);
  padding: .12rem 0;
}
.detail-synopsis-skeleton i,
.detail-synopsis-skeleton b {
  display: block;
  height: 10px;
  border-radius: var(--radius-pill);
  background: linear-gradient(90deg, var(--bg-3), var(--bg-4), var(--bg-3));
  background-size: 220% 100%;
  animation: detailSynopsisShimmer 1.25s ease-in-out infinite;
}
.detail-synopsis-skeleton i:nth-of-type(1) { width: 96%; }
.detail-synopsis-skeleton i:nth-of-type(2) { width: 89%; }
.detail-synopsis-skeleton i:nth-of-type(3) { width: 93%; }
.detail-synopsis-skeleton i:nth-of-type(4) { width: 68%; }
.detail-synopsis-skeleton b { width: 58px; height: 9px; margin-top: .2rem; }
@keyframes detailSynopsisShimmer {
  from { background-position: 200% 0; opacity: .55; }
  to { background-position: -20% 0; opacity: 1; }
}
.detail-synopsis-arriving {
  animation: detailSynopsisArrive .27s var(--ease-smooth) both;
}
.detail-synopsis-leaving {
  pointer-events: none;
  animation: detailSynopsisLeave .18s var(--ease-smooth) both;
}
@keyframes detailSynopsisArrive {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes detailSynopsisLeave {
  from { opacity: 1; }
  to { opacity: 0; }
}
.detail-info-slot.is-resizing {
  overflow: hidden;
  transition: height .32s var(--ease-smooth);
}
.detail-info-slot.is-revealing > * {
  animation: detailInfoArrive .25s var(--ease-smooth) both;
}
@keyframes detailInfoArrive {
  from { opacity: .25; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.detail-synopsis-text {
  font-size: var(--type-body);
  color: var(--text-2);
  line-height: 1.65;
  margin: 0;
}
.detail-synopsis-wrap .detail-synopsis-text {
  font-family: var(--font-body);
  font-size: var(--type-body);
  font-weight: 400;
  line-height: 1.65;
  letter-spacing: .002em;
}
.detail-chips {
  display: flex;
  flex-wrap: wrap;
  gap: .35rem;
}
.detail-chip {
  display: inline-block;
  padding: .25rem .65rem;
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 99px;
  font-size: var(--type-control);
  color: var(--text-2);
  font-weight: 500;
}

/* ── Synopsis tronqué avec voir plus ───────────────────────── */
.detail-synopsis-wrap {
  --synopsis-lines: 4;
  --synopsis-collapsed-height: calc(1.65em * var(--synopsis-lines));
  --synopsis-expanded-height: 1000px;
  position: relative;
}
.detail-synopsis-clip {
  overflow: hidden;
  max-height: var(--synopsis-collapsed-height);
  transition: max-height .34s cubic-bezier(.22, 1, .36, 1);
  will-change: max-height;
}
.detail-synopsis-wrap.expanded .detail-synopsis-clip {
  max-height: var(--synopsis-expanded-height);
}
.detail-synopsis-wrap.is-overflowing:not(.expanded) .detail-synopsis-clip {
  /* Le masque révèle directement le fond réel de la modale : aucun raccord
     visible entre les thèmes clair/sombre et aucune position fixe à ajuster. */
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 calc(100% - 1.2rem), transparent 100%);
  mask-image: linear-gradient(to bottom, #000 0%, #000 calc(100% - 1.2rem), transparent 100%);
}
.detail-synopsis-toggle {
  display: block;
  margin-top: .35rem;
  background: none;
  border: none;
  color: var(--accent);
  font-size: var(--type-control);
  font-weight: 600;
  cursor: pointer;
  padding: 0;
}
.detail-synopsis-toggle:hover { text-decoration: underline; }
@keyframes synopsisControlIn {
  from { opacity: 0; transform: translateY(3px); }
  to { opacity: 1; transform: translateY(0); }
}
.detail-synopsis-toggle.is-ready {
  animation: synopsisControlIn .2s var(--ease-smooth) both;
}
@keyframes synopsisLabelChange {
  0%   { opacity: .45; transform: translateY(2px); }
  100% { opacity: 1; transform: translateY(0); }
}
.detail-synopsis-toggle.is-changing {
  animation: synopsisLabelChange .2s ease-out both;
}

/* ── Label statut sur les cards ─────────────────────────────── */
.card-status-label {
  position: absolute;
  bottom: 2rem;
  left: .5rem;
  background: rgba(13,13,15,.75);
  backdrop-filter: blur(6px);
  color: var(--text-2);
  font-size: var(--type-caption);
  font-weight: 700;
  letter-spacing: .04em;
  padding: .2rem .45rem;
  border-radius: 99px;
  border: 1px solid rgba(255,255,255,.08);
  pointer-events: none;
  opacity: 1;
  transition: opacity .2s ease;
}

/* ── Card enter (ajout) ───────────────────────────────────── */
@keyframes cardEnter {
  from { opacity: 0; transform: translateY(-12px) scale(.95); }
  to   { opacity: 1; transform: none; }
}
.card-enter {
  animation: cardEnter .35s cubic-bezier(.34,1.56,.64,1) forwards;
}

/* ── Card exit (suppression) ──────────────────────────────── */
@keyframes cardExit {
  from { opacity: 1; transform: scale(1); }
  to   { opacity: 0; transform: scale(.88) translateY(8px); }
}
.card-exit {
  animation: cardExit .28s ease-in forwards;
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
  }
}

/* iOS agrandit automatiquement la page au focus sous 16 px. Le correctif
   reste limité au mobile et ne désactive pas le zoom volontaire à deux doigts. */
@media (max-width: 680px) {
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="hidden"]),
  textarea:not(:disabled),
  select:not(:disabled) {
    font-size: var(--type-lead);
  }
}

@media (max-width: 520px) {
  .profile-identity-bar { flex-wrap: wrap; }
  .profile-identity-actions {
    width: 100%;
    justify-content: flex-end;
  }
}

/* ============================================================
   KULTURO 2.2 — UNIFORMISATION MODERNE
   ============================================================ */

body { letter-spacing: -.006em; }
h1, h2, h3 { color: var(--text-1); }

/* Barre globale : les trois colonnes gardent toujours la même largeur. */
#topbar {
  display: grid;
  grid-template-columns: 220px minmax(280px, 560px) 220px;
  justify-content: space-between;
  align-items: center;
  gap: 1.25rem;
  min-height: calc(var(--topbar-height) + var(--safe-top));
  padding: var(--safe-top) max(1.25rem, calc(.75rem + var(--safe-right))) 0 max(1.25rem, calc(.75rem + var(--safe-left)));
  background: color-mix(in srgb, var(--bg-2) 92%, transparent);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  backdrop-filter: blur(18px) saturate(1.2);
}
.topbar-logo {
  width: auto;
  padding: 0;
  font-size: var(--type-title-lg);
  letter-spacing: -.035em;
}
.topbar-tagline {
  margin-top: .12rem;
  font-size: var(--type-brandline);
  letter-spacing: .08em;
}
.topbar-search-wrap {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
}
.topbar-search-wrap input {
  height: 42px;
  border-radius: 12px;
  background: color-mix(in srgb, var(--bg-3) 88%, transparent);
  border-color: color-mix(in srgb, var(--border) 88%, transparent);
