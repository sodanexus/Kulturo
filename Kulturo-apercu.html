button, input, select, textarea { font-weight: 500; }
#topbar { display: flex; height: calc(var(--topbar-height) + var(--safe-top)); padding: var(--safe-top) 28px 0; background: var(--bg); border-bottom: 1px solid var(--border); gap: 24px; }

}

.auth-editorial h2 em { font-family: var(--font-editorial); color: var(--accent-2); font-weight: 400; }

.auth-colophon { margin-top: auto; padding-top: 90px; color: var(--text-3); font-size: 10px; letter-spacing: .08em; }
.auth-art { position: absolute; bottom: 70px; right: -45px; display: flex; transform: rotate(-25deg); opacity: .45; }
.auth-art i { width: 180px; height: 180px; border: 1px solid var(--accent); border-radius: 50%; margin-left: -80px; }
.auth-art i:nth-child(2) { background: #d4b58012; }
.auth-art i:nth-child(3) { background: #d4b58025; }
.auth-art span { position: absolute; bottom: -25px; right: 65px; font-size: 9px; letter-spacing: .25em; }
.auth-card { width: min(390px,calc(100% - 64px)); max-width: none; align-self: center; justify-self: center; margin: 50px 0; padding: 0; border: none; border-radius: 0; background: transparent; box-shadow: none; text-align: left; }
.auth-card .logo, .auth-card .tagline { display: none; }
.auth-title { margin: 20px 0 12px; font-family: var(--font-editorial); font-size: 44px; font-weight: 400; letter-spacing: -.04em; line-height: 1.08; }
.auth-intro { margin-bottom: 36px; color: var(--text-3); font-size: 13px; }
.auth-form label { font-size: 11px; color: var(--text-2); font-weight: 500; }
.auth-form input { height: 48px; background: var(--bg-2); }
.auth-form .btn { margin-top: 10px; min-height: 48px; }
/* Desktop navigation gains names and a colophon; tablet keeps the rail. */
@media (min-width:1100px) {
  #sidebar { width: 206px; padding: 36px 18px 24px; }
  #main { padding-left: 248px; padding-right: 42px; }
  .sidebar-caption { display: block; margin: 0 14px 22px; font-size: 9px; letter-spacing: .15em; text-transform: uppercase; color: var(--text-3); }
  .nav-items-group { padding: 0; gap: 8px; }
  .nav-item { justify-content: flex-start; gap: 12px; padding-inline: 13px; }
  .nav-label { display: block; font-size: 12px; font-weight: 500; }
  .nav-item::after { display: none; }
  .nav-indicator { left: 18px; right: 18px; }
  .sidebar-add-btn { width: 100%; margin: 26px 0 0; display: flex; justify-content: flex-start; gap: 10px; padding: 0 12px; }
  .sidebar-add-label { display: block; font-size: 11px; font-weight: 500; }
  .sidebar-colophon { display: block; margin-top: auto; padding: 28px 14px 0; }
  .sidebar-colophon > span { font-family: var(--font-editorial); color: var(--text-2); font-style: italic; font-size: 27px; line-height: 1.15; }
  .sidebar-colophon small { display: block; margin-top: 16px; color: var(--text-3); font-size: 9px; letter-spacing: .08em; }
}
@media (max-width:1099px) and (min-width:681px) {
  .editorial-aside > span:first-child { display: none; }
  .editorial-header h1 { font-size: clamp(36px,5.5vw,58px); }
  #cards-grid, .upcoming-grid { grid-template-columns: repeat(4,minmax(0,1fr)); gap: 25px 18px; }
  :root[data-library-density="compact"] #cards-grid, :root[data-library-density="compact"] .upcoming-grid { grid-template-columns: repeat(5,minmax(0,1fr)); }
}
@media (max-width:680px) {
  :root { --topbar-height: 66px; }
  #topbar { padding: var(--safe-top) 20px 0; gap: 12px; }
  .topbar-logo { width: auto; min-width: 0; gap: 8px; }
  .topbar-right { min-width: 36px; width: 36px; }
  .topbar-wordmark { font-size: 25px; }
  .topbar-mark { width: 30px; height: 22px; }
  .topbar-tagline { display: none; }
  .topbar-search-wrap { flex: 1; min-width: 0; }
  .topbar-search-wrap input::placeholder { font-size: 11px; }
  .topbar-search-wrap input { min-width: 0; padding-right: 8px; font-size: 11px; height: 38px; }
  .topbar-filter-btn { width: 36px; min-width: 36px; height: 38px; min-height: 38px; }
  #sidebar { display: none; }
  #main { padding: 0 20px calc(112px + var(--safe-bottom)); scrollbar-gutter: auto; }
  .editorial-header { padding: 29px 0 24px; margin-bottom: 20px; gap: 10px; }
  .editorial-header h1 { font-size: clamp(33px,8.8vw,51px); margin: 14px 0 10px; }
  .editorial-heading > p { max-width: 260px; font-size: 11px; line-height: 1.7; }
  .edition-label { font-size: 9px; letter-spacing: .13em; }
  .editorial-aside { display: none; }
  #cards-grid, .upcoming-grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 26px 15px; }
  :root[data-library-density="compact"] #cards-grid, :root[data-library-density="compact"] .upcoming-grid { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 23px 12px; }
  .card-title { font-size: 12px; margin-top: 10px; }
  .card-caption { font-size: 10px; }
  .card-bottom { margin-top: 7px; }
  .library-list-heading { margin-top: 23px; margin-bottom: 16px; }
  .continue-section { margin-bottom: 20px; }
  .continue-heading-copy h2 { font-size: 13px; }
  #bottom-nav { bottom: max(12px,var(--safe-bottom)); left: max(14px,var(--safe-left)); right: max(14px,var(--safe-right)); width: auto; height: 66px; padding: 6px 7px; border: 1px solid #4b4e4066; border-radius: 15px; background: #1c1f19f2; box-shadow: 0 12px 40px #0007; backdrop-filter: blur(16px); }
  #bottom-nav::after { display: none; }
  #bottom-nav { min-height: 66px; }
  .bottom-nav-item { min-height: 48px; color: var(--text-3); gap: 5px; }
  .bottom-nav-item > span { font-size: 9px; font-weight: 500; }
  .bottom-nav-item svg { width: 19px; height: 19px; }
  .bottom-nav-item.active { color: var(--accent-2); }
  .bottom-nav-add { flex: 0 0 44px; width: 44px; height: 44px; min-height: 44px; margin: 0 auto; border-radius: 50%; background: var(--accent); color: var(--bg); box-shadow: none; transform: none; }
  .bottom-nav-add svg { width: 21px; height: 21px; }
  .bottom-nav-add:active { transform: scale(.94); }
  .upcoming-toolbar { padding-top: 0; margin-top: 0; }
  .upcoming-type-switch { width: 100%; }
  .upcoming-type-switch > button { padding-inline: 8px; font-size: 11px; }
  .upcoming-month-heading h2, .journal-month-heading { font-size: 25px; }
  .journal-sticky-controls { margin-top: 0; }
  .profile-year-overview, .profile-dashboard-card, .journal-month-summary { padding: 18px; }

  .profile-action-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }

  .profile-card-heading h3 { font-size: 23px; }
  .detail-modal { height: calc(94dvh - var(--safe-top)); max-height: calc(94dvh - var(--safe-top)); border-radius: 18px 18px 0 0; border-bottom: 0; }
  .detail-backdrop, .detail-backdrop.has-backdrop { height: 245px; border-radius: 18px 18px 0 0; }
  .detail-backdrop-content { padding: 20px; gap: 17px; }
  .detail-poster, .detail-poster-placeholder { width: 91px; min-width: 91px; height: 136.5px; border-radius: 5px; }
  .detail-title { font-size: 25px; line-height: 1.1; margin-bottom: 12px; }
  .detail-backdrop-info { max-height: 190px; }
  .detail-rating .rating-score { font-size: 16px; }
  .detail-body { padding: 12px 20px 22px; }
  .detail-modal .modal-footer { padding: 13px 20px calc(13px + var(--safe-bottom)); }
  .detail-modal.mobile-swipe-sheet .detail-close-btn { display: flex; top: 13px; right: 13px; }
  .detail-swipe-handle { width: 30px; height: 3px; background: #ffffff50; }
  .wz-manual-types { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .ui-state-empty { min-height: 290px; padding: 30px 20px; }
  .ui-state-empty h3 { font-size: 25px; }
  #page-auth { grid-template-columns: 1fr; }
  .auth-editorial { min-height: auto; padding: 26px 28px 32px; }
  .auth-brand { margin-bottom: 30px; font-size: 26px; }
  .auth-brand img { width: 38px; }
  .auth-editorial h2 { font-size: 49px; margin: 18px 0 0; }
  .auth-editorial > p, .auth-colophon, .auth-editorial > .edition-label { display: none; }
  .auth-art { bottom: 30px; right: -50px; }
  .auth-art i { width: 125px; height: 125px; margin-left: -60px; }
  .auth-art span { display: none; }
  .auth-card { width: calc(100% - 56px); margin: 35px 0 50px; }
  .auth-title { font-size: 34px; }
  .auth-intro { margin-bottom: 25px; }
}
@media (max-width:360px) {
