}
.topbar-right {
  width: 220px;
  min-width: 220px;
  padding: 0;
  justify-content: flex-end;
}
.topbar-filter-btn {
  position: relative;
  display: grid;
  place-items: center;
  width: 42px;
  min-width: 42px;
  height: 40px;
  min-height: 40px;
  padding: 0;
  border-radius: 12px;
  background: var(--bg-3);
  font-weight: 650;
}
.topbar-filter-btn > svg { width: 18px; height: 18px; }
.topbar-filter-btn .filter-fab-badge {
  position: absolute;
  top: -6px;
  right: -6px;
  display: grid;
  place-items: center;
  min-width: 18px;
  height: 18px;
  padding: 0 .3rem;
  border: 2px solid var(--bg-2);
  font-size: var(--type-micro);
  line-height: 1;
}
.topbar-filter-btn:is(.is-inactive, .is-search-mode) {
  visibility: hidden;
  pointer-events: none;
}

/* Navigation et zone de contenu. */
#sidebar {
  border-color: color-mix(in srgb, var(--border) 82%, transparent);
  background: color-mix(in srgb, var(--bg-2) 96%, transparent);
}
.nav-item,
.nav-indicator { border-radius: 12px; }
#main { padding-top: 0; }
.page {
  width: 100%;
  max-width: 1480px;
  margin: 0 auto;
}
.topbar-logo,
.auth-card .logo { font-weight: 800; letter-spacing: -.03em; }
.page-kicker,
.section-eyebrow {
  display: block;
  color: var(--accent);
  font-size: var(--type-caption);
  font-weight: 800;
  letter-spacing: .1em;
  line-height: 1.2;
  text-transform: uppercase;
}
.section-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
}
.section-heading h2 {
  font-family: var(--font-body);
  font-size: var(--type-lead);
  font-weight: 750;
  letter-spacing: -.02em;
}
.section-count {
  color: var(--text-3);
  font-size: var(--type-label);
  font-weight: 600;
}
.library-list-heading { justify-content: flex-end; margin-top: 1rem; }

/* Contrôles, panneaux et rayons cohérents. */
input, textarea, select { border-radius: 12px; }
.btn {
  min-height: 40px;
  border-radius: 12px;
  padding: .55rem 1rem;
  font-weight: 700;
  transition: background-color var(--motion-base) var(--ease-smooth),
              border-color var(--motion-base) var(--ease-smooth),
              color var(--motion-base) var(--ease-smooth),
              box-shadow var(--motion-base) var(--ease-smooth),
              transform var(--motion-fast) var(--ease-smooth);
}
.btn-sm { min-height: 34px; padding: .4rem .72rem; }
.btn-primary { color: #17140e; }
.btn-primary:hover { box-shadow: 0 8px 24px rgba(216,180,106,.18); }
.btn-ghost { border-radius: 12px; }
.filter-chip,
.filter-select,
.badge { border-radius: var(--radius-pill); }
.filter-chip.active { box-shadow: 0 4px 16px var(--accent-glow); }
.topbar-search-wrap input:focus {
  box-shadow: 0 0 0 3px var(--accent-glow), 0 8px 24px color-mix(in srgb, var(--accent) 9%, transparent);
}
.modal,
.auth-card { border-radius: var(--radius-xl); }
.stat-card,
.chart-card,
.profile-section,
.profile-identity-bar,
.activity-row { border-radius: var(--radius-lg); }

/* Grille et affiches. */
#cards-grid {
  margin-top: .75rem;
  gap: .9rem;
}
.media-card { border-radius: var(--radius); }
.card-cover,
.card-cover-placeholder {
  border-radius: var(--radius);
  box-shadow: var(--media-cover-shadow);
}
.card-status-label {
  background: rgba(12,13,17,.76);
  border-color: rgba(255,255,255,.1);
  border-radius: var(--radius-pill);
}
.skeleton-card { border-radius: var(--radius); }

/* Étagère En cours. */
.continue-section {
  margin: 1.15rem 0 0;
  padding: .35rem 1rem .45rem;
  overflow: visible;
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  background:
    radial-gradient(circle at 0 0, var(--accent-glow), transparent 36%),
    var(--bg-2);
  transition: border-color var(--motion-base) var(--ease-smooth),
              box-shadow var(--motion-base) var(--ease-smooth),
              background-color var(--motion-base) var(--ease-smooth);
}
.continue-toggle {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 34px;
  align-items: center;
  gap: .75rem;
  width: 100%;
  min-height: 58px;
  padding: .35rem 0;
  border: 0;
  background: transparent;
  color: var(--text);
  text-align: left;
}
.continue-heading-copy { display: flex; align-items: baseline; gap: .55rem; min-width: 0; }
.continue-heading-copy h2 {
  color: var(--text-1);
  font-family: var(--font-body);
  font-size: var(--type-lead);
  font-weight: 800;
  letter-spacing: -.02em;
}
.continue-heading-copy > span {
  color: var(--text-3);
  font-size: var(--type-caption);
  font-weight: 700;
  white-space: nowrap;
}
.continue-preview { display: flex; align-items: center; padding-left: 18px; }
.continue-preview-cover {
  position: relative;
  display: grid;
  place-items: center;
  width: 31px;
  height: 43px;
  margin-left: -18px;
  overflow: hidden;
  border: 2px solid var(--bg-2);
  border-radius: 9px;
  background: var(--bg-4);
  color: var(--text-3);
  font-size: var(--type-control);
  box-shadow: 0 5px 14px rgba(0,0,0,.22);
  transition: transform var(--motion-base) var(--ease-spring), opacity var(--motion-fast) ease;
}
.continue-preview-cover:nth-child(2) { transform: translateY(1px); }
.continue-preview-cover:nth-child(3) { transform: translateY(2px); }
.continue-preview-cover img { width: 100%; height: 100%; object-fit: cover; }
.continue-chevron {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: var(--bg-3);
  color: var(--text-2);
  transition: transform var(--motion-slow) var(--ease-spring),
              background-color var(--motion-fast) ease,
              color var(--motion-fast) ease;
}
.continue-section.is-expanded .continue-chevron { transform: rotate(180deg); }
.continue-expand {
  display: grid;
  grid-template-rows: 0fr;
  opacity: 0;
  transform: translateY(-5px);
  transition: grid-template-rows var(--motion-slow) var(--ease-smooth),
              opacity var(--motion-base) ease,
              transform var(--motion-slow) var(--ease-smooth);
}
.continue-expand-inner { min-height: 0; overflow: hidden; }
.continue-section.is-expanded .continue-expand {
  grid-template-rows: 1fr;
  opacity: 1;
  transform: translateY(0);
}
.continue-expanded-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  min-height: 32px;
  margin-bottom: .7rem;
  border-top: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
  color: var(--text-3);
  font-size: var(--type-caption);
}
.section-link {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  padding: .35rem .1rem;
  border: 0;
  background: transparent;
  color: var(--text-2);
  font-size: var(--type-label);
  font-weight: 700;
}
.section-link:hover { color: var(--accent); }
.continue-track {
  display: flex;
  gap: var(--media-rail-gap);
  overflow-x: auto;
  margin: -.35rem calc(-1 * var(--media-rail-gutter));
  padding: .35rem var(--media-rail-gutter) .5rem;
  scroll-snap-type: x proximity;
  scroll-padding-inline: var(--media-rail-gutter);
  scrollbar-width: none;
}
.continue-track::-webkit-scrollbar { display: none; }
.continue-card {
  flex: 0 0 128px;
  min-width: 0;
  border: 0;
  background: transparent;
  color: var(--text);
  text-align: left;
  scroll-snap-align: start;
}
.continue-cover {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 2 / 3;
  overflow: hidden;
  border-radius: var(--radius);
  background: var(--bg-3);
  box-shadow: var(--media-cover-shadow);
}
.continue-cover > img,
.continue-cover-placeholder {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.continue-cover-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--type-metric-md);
}
.continue-play {
  position: absolute;
  right: .55rem;
  bottom: .55rem;
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 50%;
  background: rgba(12,13,17,.72);
  color: var(--accent-2);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.continue-card-copy { display: block; padding: .55rem .1rem 0; }
.continue-card-copy strong {
  display: -webkit-box;
  overflow: hidden;
  color: var(--text-1);
  font-size: var(--type-control);
  font-weight: 700;
  line-height: 1.3;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}
.continue-card-copy small {
  display: block;
  margin-top: .18rem;
  color: var(--text-3);
  font-size: var(--type-caption);
}
@media (hover: hover) and (pointer: fine) {
  .continue-section:hover { border-color: color-mix(in srgb, var(--accent) 28%, var(--border)); }
  .continue-toggle:hover .continue-preview-cover:nth-child(1) { transform: translateX(-2px) rotate(-2deg); }
  .continue-toggle:hover .continue-preview-cover:nth-child(2) { transform: translateY(1px); }
  .continue-toggle:hover .continue-preview-cover:nth-child(3) { transform: translateX(2px) translateY(2px) rotate(2deg); }
  .continue-toggle:hover .continue-chevron { background: var(--bg-4); color: var(--accent); }
}

/* Actions rapides dans la fiche. */
.detail-quick-actions {
  --quick-actions-gap: .55rem;
  padding: .9rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--bg-3);
  transition: opacity var(--motion-fast) ease;
}
.detail-quick-actions.is-saving { opacity: .65; }
.quick-actions-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  margin-bottom: .65rem;
  color: var(--text-3);
  font-size: var(--type-caption);
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.quick-actions-feedback {
  color: var(--success);
  font-size: var(--type-caption);
  letter-spacing: 0;
  opacity: 0;
  text-transform: none;
  transition: opacity var(--motion-fast) ease;
}
.quick-actions-feedback.is-visible { opacity: 1; }
.quick-status-control {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: .25rem;
  padding: .25rem;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg-2);
}
.quick-status-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .35rem;
  min-width: 0;
  min-height: 36px;
  padding: .4rem .5rem;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  color: var(--text-3);
  font-size: var(--type-label);
  font-weight: 700;
}
.quick-status-btn:hover { color: var(--text); background: var(--bg-3); }
.quick-status-btn .ui-icon-status { color: currentColor; }
.quick-status-btn.active {
  border-color: color-mix(in srgb, var(--accent) 55%, transparent);
  background: var(--accent-glow);
  color: var(--accent-2);
}
.quick-repeat-row {
  width: 100%;
  margin-top: var(--quick-actions-gap);
}
.detail-fav { opacity: 0; transform: scale(.7); }
.detail-fav.is-active { opacity: 1; transform: scale(1); }
.detail-modal .modal-footer {
  align-items: center;
  justify-content: space-between;
}
.detail-footer-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: .5rem;
  margin-left: auto;
}

/* Bandeau de mise à jour. */
.update-banner {
  position: fixed;
  right: 1.25rem;
  bottom: 1.25rem;
  z-index: 980;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  align-items: center;
  gap: .75rem;
  width: min(520px, calc(100vw - 2.5rem));
  padding: .75rem;
  border: 1px solid color-mix(in srgb, var(--accent) 42%, var(--border));
  border-radius: var(--radius-lg);
  background: color-mix(in srgb, var(--bg-2) 94%, transparent);
  box-shadow: var(--shadow-lg);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
  animation: updateBannerIn var(--motion-slow) var(--ease-out) both;
}
.update-banner[hidden] { display: none !important; }
@keyframes updateBannerIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
.update-banner-icon {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 11px;
  background: var(--accent-glow);
  color: var(--accent-2);
  font-size: var(--type-title-sm);
}
.update-banner-copy { display: flex; flex-direction: column; min-width: 0; }
.update-banner-copy strong { color: var(--text-1); font-size: var(--type-control); }
.update-banner-copy span { color: var(--text-3); font-size: var(--type-caption); }
.update-banner-close {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--text-3);
}
.update-banner-close:hover { background: var(--bg-3); color: var(--text); }

/* Barres et panneaux secondaires uniformisés. */
.upcoming-toolbar {
  margin-top: .9rem;
  border-radius: var(--radius-lg);
}
.upcoming-type-switch,
.upcoming-genre-filter { border-radius: 12px; }
.upcoming-type-btn { border-radius: 9px; }
.activity-row { border: 1px solid transparent; }
.activity-row:hover { border-color: var(--border); background: var(--bg-2); }

@media (min-width: 681px) and (max-width: 1100px) {
  #topbar {
    grid-template-columns: 180px minmax(260px, 1fr) 140px;
    gap: .75rem;
    padding-left: max(1rem, calc(.5rem + var(--safe-left)));
    padding-right: max(1rem, calc(.5rem + var(--safe-right)));
  }
  .topbar-logo { width: 180px; gap: .45rem; }
  .topbar-mark { width: 48px; height: 30px; }
  .topbar-right { width: 140px; min-width: 140px; }
}

@media (max-width: 680px) {
  #topbar {
    grid-template-columns: 84px minmax(0, 1fr) 42px;
    gap: .55rem;
    min-height: calc(62px + var(--safe-top));
    padding: var(--safe-top) max(.9rem, calc(.5rem + var(--safe-right))) 0 max(.9rem, calc(.5rem + var(--safe-left)));
  }
  .topbar-logo { width: 84px; font-size: var(--type-title-sm); }
  .topbar-right { width: 42px; min-width: 42px; }
  .topbar-filter-btn {
    width: 42px;
    padding: 0;
  }
  .topbar-search-wrap input { height: 40px; padding-left: 2.15rem; }
  .topbar-search-wrap input::placeholder { font-size: var(--type-control); }
  .topbar-search-wrap .search-icon { left: .7rem; }

  #main { padding-top: 0; }
  .page-kicker { font-size: var(--type-caption); }

  .continue-section {
    margin-top: .9rem;
    padding: .25rem .8rem .35rem;
    border-radius: var(--radius-lg);
  }
  .continue-toggle { min-height: 56px; gap: .55rem; }
  .continue-heading-copy { flex-direction: column; align-items: flex-start; gap: 0; }
  .continue-heading-copy h2 { font-size: var(--type-lead); }
  .continue-heading-copy > span { font-size: var(--type-caption); }
  .continue-preview-cover { width: 28px; height: 39px; margin-left: -16px; border-radius: 8px; }
  .continue-expanded-head { margin-bottom: .6rem; }
  .continue-expanded-head > span:first-child { display: none; }
  .continue-expanded-head .section-link { margin-left: auto; }
  .continue-card { flex-basis: 112px; }
  .continue-track {
    margin: -.3rem calc(-1 * var(--media-rail-gutter)) -.35rem;
    padding: .3rem var(--media-rail-gutter) .5rem;
    scroll-padding-inline: var(--media-rail-gutter);
  }
  .library-list-heading { margin-top: .85rem; }

  .upcoming-toolbar {
    margin-top: .75rem;
    border-radius: 0;
  }

  .detail-modal .modal-footer { gap: .65rem; }
  .detail-footer-actions { gap: .4rem; }
  .detail-footer-actions .btn { min-height: 36px; }

  .update-banner {
    left: max(.8rem, calc(.4rem + var(--safe-left)));
    right: max(.8rem, calc(.4rem + var(--safe-right)));
    bottom: calc(82px + var(--safe-bottom));
    width: auto;
    grid-template-columns: auto minmax(0, 1fr) auto;
  }
  .update-banner .btn { grid-column: 2 / 3; justify-self: start; }
  .update-banner-close { grid-column: 3; grid-row: 1; }
  .update-banner-copy span { display: none; }
  .bottom-nav-add { box-shadow: 0 6px 20px var(--accent-glow); }
}

@media (max-width: 390px) {
  #topbar { grid-template-columns: 72px minmax(0, 1fr) 42px; }
  .topbar-logo { width: 72px; font-size: var(--type-title-sm); }
  .topbar-right { width: 42px; min-width: 42px; }
  .topbar-filter-btn { width: 42px; font-size: 0; padding: 0; }
  .topbar-filter-btn svg { width: 16px; height: 16px; }
  .quick-status-btn { font-size: var(--type-label); }
}

/* Sur desktop et tablette, le centre du symbole est sur le même axe vertical
   que les boutons de la navigation latérale (56px de large). */
@media (min-width: 681px) {
  #topbar {
    padding-left: var(--safe-left);
    padding-right: var(--safe-right);
  }
  .topbar-logo {
    padding-left: 4px;
    gap: .55rem;
  }
  .topbar-mark { width: 48px; height: 30px; }
  .topbar-right { padding-right: 20px; }

/* ============================================================
   KULTURO 2.3 — ERGONOMIE DES PAGES
   ============================================================ */

/* Action d'ajout toujours accessible sur desktop. */
.sidebar-add-btn {
  position: relative;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  margin: .75rem auto 0;
  border: 0;
  border-radius: 13px;
  background: var(--accent);
  color: #17140e;
  box-shadow: 0 8px 22px var(--accent-glow);
  transition: transform var(--motion-fast) var(--ease-smooth), background-color var(--motion-base) var(--ease-smooth);
}
.sidebar-add-btn:hover { background: var(--accent-2); transform: translateY(-1px); }
.sidebar-add-btn:active { transform: scale(.94); }
.sidebar-add-btn::after {
  content: attr(data-tooltip);
  position: absolute;
  left: calc(100% + 10px);
  top: 50%;
  z-index: 220;
  padding: .35rem .7rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg-4);
  color: var(--text);
  font-size: var(--type-label);
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transform: translateY(-50%);
  transition: opacity var(--motion-fast) ease;
}
.sidebar-add-btn:hover::after { opacity: 1; }

/* Les filtres appliqués restent compréhensibles après fermeture du panneau. */
.active-filter-summary {
  display: flex;
  align-items: center;
  gap: .65rem;
  min-height: 44px;
  margin-top: .75rem;
  padding: .45rem .55rem;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--bg-2);
}
.active-filter-label {
  flex: 0 0 auto;
  color: var(--text-3);
  font-size: var(--type-caption);
  font-weight: 800;
  letter-spacing: .07em;
  text-transform: uppercase;
}
.active-filter-chips {
  display: flex;
  align-items: center;
  gap: .35rem;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.active-filter-chips::-webkit-scrollbar { display: none; }
.active-filter-chip {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  flex: 0 0 auto;
  min-height: 30px;
  padding: .32rem .62rem;
  border: 1px solid color-mix(in srgb, var(--accent) 38%, var(--border));
  border-radius: var(--radius-pill);
  background: var(--accent-glow);
  color: var(--accent-2);
  font-size: var(--type-label);
  font-weight: 700;
}
.active-filter-chip:hover { border-color: var(--accent); }
.active-filter-chip span { font-size: var(--type-body); line-height: 1; }
.active-filter-reset {
  flex: 0 0 auto;
  padding: .25rem;
  border: 0;
  background: transparent;
  color: var(--text-3);
  font-size: var(--type-caption);
  font-weight: 700;
}
.active-filter-reset:hover { color: var(--text); }

.back-to-top {
  position: fixed;
  right: 1.25rem;
  bottom: 1.25rem;
  z-index: 140;
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border: 1px solid var(--border-2);
  border-radius: 14px;
  background: color-mix(in srgb, var(--bg-3) 94%, transparent);
  color: var(--text-2);
  box-shadow: var(--shadow);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  animation: updateBannerIn var(--motion-base) var(--ease-out) both;
}
.back-to-top:hover { border-color: var(--accent); color: var(--accent); }
.back-to-top span { font-size: var(--type-title-sm); line-height: 1; }
.back-to-top.is-obscured { opacity: 0; pointer-events: none; }

/* Sorties : préférences compactes et lecture chronologique par mois. */
.upcoming-toolbar {
  display: grid;
  grid-template-columns: auto minmax(210px, 260px) minmax(260px, 1fr);
  align-items: center;
  gap: .65rem;
}
.upcoming-toolbar-meta {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: .8rem;
  min-width: 0;
}
.compact-toggle {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  color: var(--text-2);
  font-size: var(--type-label);
  font-weight: 650;
  cursor: pointer;
  white-space: nowrap;
}
.compact-toggle input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}
.compact-toggle-track {
  position: relative;
  display: block;
  box-sizing: border-box;
  flex: 0 0 34px;
  width: 34px;
  height: 20px;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--border-2);
  border-radius: var(--radius-pill);
  background: var(--bg-3);
  transition: background-color var(--motion-fast) ease, border-color var(--motion-fast) ease;
}
.compact-toggle-track span {
  position: absolute;
  top: 3px;
  left: 3px;
  display: block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--text-3);
  transition: transform var(--motion-fast) var(--ease-smooth), background-color var(--motion-fast) ease;
}
.compact-toggle input:checked + .compact-toggle-track {
  border-color: var(--accent);
  background: var(--accent-glow);
}
.compact-toggle input:checked + .compact-toggle-track span {
  background: var(--accent);
  transform: translate3d(16px, 0, 0);
}
.compact-toggle input:focus-visible + .compact-toggle-track { outline: 2px solid var(--accent); outline-offset: 3px; }
.upcoming-months { display: flex; flex-direction: column; gap: 1.25rem; }
.upcoming-month-section { min-width: 0; }
.upcoming-month-heading {
  position: sticky;
  top: 0;
  z-index: 35;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: .75rem;
  padding: .55rem .15rem;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
}
.upcoming-month-heading h2 {
  font-family: var(--font-body);
  font-size: var(--type-body);
  font-weight: 800;
  letter-spacing: -.015em;
  text-transform: capitalize;
}
.upcoming-month-heading span { color: var(--text-3); font-size: var(--type-caption); font-weight: 650; }

.activity-row.is-clickable { cursor: pointer; }
.activity-row.is-clickable:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
.activity-row.is-clickable:active { transform: scale(.995); }

/* Profil : statistiques utiles, visuelles et reliées à la bibliothèque. */
#dashboard-content { gap: 1rem; }
.profile-year-overview,
.profile-dashboard-card,
.profile-account-details {
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  background: var(--bg-2);
}
.profile-year-overview {
  padding: 1rem;
  background:
    radial-gradient(circle at 0 0, var(--accent-glow), transparent 38%),
    var(--bg-2);
}
.profile-year-header { margin: 0 0 .85rem; }
.profile-year-header h2 {
  margin-top: .2rem;
  font-family: var(--font-body);
  font-size: var(--type-lead);
  font-weight: 800;
  letter-spacing: -.025em;
}
.profile-year-inline { width: auto; min-width: 92px; }
.profile-year-summary {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(180px, .75fr);
  gap: .65rem;
}
.profile-year-primary,
.profile-year-secondary {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 118px;
  padding: 1rem;
  border-radius: var(--radius-lg);
}
.profile-year-primary {
  background: linear-gradient(130deg, color-mix(in srgb, var(--accent) 22%, var(--bg-3)), var(--bg-3));
}
.profile-year-secondary { border: 1px solid var(--border); background: var(--bg-3); }
.profile-year-primary strong { color: var(--accent-2); font-size: var(--type-metric-lg); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.profile-year-primary span { margin-top: .35rem; color: var(--text-1); font-size: var(--type-body); font-weight: 750; }
.profile-year-primary small,
.profile-year-secondary small { margin-top: .25rem; color: var(--text-3); font-size: var(--type-caption); }
.profile-year-secondary > span { color: var(--text-3); font-size: var(--type-caption); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.profile-year-secondary strong { margin-top: .35rem; color: var(--text-1); font-size: var(--type-title-lg); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.profile-action-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: .55rem;
  margin-top: .65rem;
}
.profile-action-card {
  position: relative;
  display: grid;
  grid-template-columns: auto 1fr auto;
  grid-template-rows: auto auto;
  align-items: center;
  column-gap: .55rem;
  min-width: 0;
  min-height: 74px;
  padding: .7rem;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--bg-3);
  color: var(--text);
  text-align: left;
  transition: border-color var(--motion-fast) ease, background-color var(--motion-fast) ease, transform var(--motion-fast) ease;
}
.profile-action-card:hover { border-color: color-mix(in srgb, var(--accent) 42%, var(--border)); background: var(--bg-4); transform: translateY(-1px); }
.profile-action-card:active { transform: scale(.985); }
.profile-action-icon { grid-row: 1 / 3; color: var(--accent); font-size: var(--type-lead); }
.profile-action-card strong { align-self: end; color: var(--text-1); font-size: var(--type-lead); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.profile-action-card > span:nth-of-type(2) { align-self: start; color: var(--text-3); font-size: var(--type-caption); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.profile-action-card i { grid-column: 3; grid-row: 1 / 3; color: var(--text-3); font-style: normal; }
.profile-dashboard-card { padding: 1rem; overflow: hidden; }
.profile-ratings-card { min-width: 0; }
.profile-insights-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, .65fr); gap: 1rem; }
.profile-card-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: .75rem; margin-bottom: .85rem; }
.profile-card-heading h3 { margin-top: .15rem; font-family: var(--font-body); font-size: var(--type-lead); font-weight: 800; }
.profile-top-track {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: var(--media-rail-gap);
}
.profile-top-card {
  position: relative;
  min-width: 0;
  border: 0;
  background: transparent;
  color: var(--text);
  text-align: left;
}
.profile-top-cover {
  display: grid;
  place-items: center;
  width: 100%;
  aspect-ratio: 2 / 3;
  overflow: hidden;
  border-radius: 12px;
  background: var(--bg-3);
  color: var(--text-3);
  box-shadow: var(--media-cover-shadow);
}
.profile-top-cover img { width: 100%; height: 100%; object-fit: cover; }
.profile-top-card strong { display: block; margin-top: .42rem; overflow: hidden; color: var(--text-1); font-size: var(--type-label); font-weight: 700; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; }
.profile-top-card small { display: block; margin-top: .1rem; color: var(--accent); font-size: var(--type-caption); font-weight: 750; }
.profile-top-rating { font-size: inherit; }
.profile-top-rank {
  position: absolute;
  top: .35rem;
  left: .35rem;
  z-index: 2;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 8px;
  background: rgba(12,13,17,.78);
  color: var(--accent-2);
  font-size: var(--type-caption);
  font-weight: 800;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.profile-inline-empty { padding: 1rem 0; color: var(--text-3); font-size: var(--type-label); }
.profile-category-list { display: flex; flex-direction: column; gap: .35rem; }
.profile-category-row {
  display: flex;
  align-items: center;
  gap: .65rem;
  width: 100%;
  min-height: 48px;
  padding: .5rem .55rem;
  border: 1px solid transparent;
  border-radius: 12px;
  background: transparent;
  color: var(--text);
  text-align: left;
}
.profile-category-row:hover { border-color: var(--border); background: var(--bg-3); }
.profile-category-row { transition: border-color var(--motion-fast) ease, background-color var(--motion-fast) ease, transform var(--motion-fast) var(--ease-smooth); }
.profile-category-row:active { transform: scale(.985); }
.profile-category-icon { width: 24px; text-align: center; font-size: var(--type-body); }
.profile-category-copy { flex: 1; min-width: 0; }
.profile-category-copy > span:first-child { display: flex; justify-content: space-between; gap: .5rem; margin-bottom: .28rem; }
.profile-category-copy strong { color: var(--text-2); font-size: var(--type-label); }
.profile-category-copy em { color: var(--text-3); font-size: var(--type-caption); font-style: normal; font-weight: 700; }
.profile-category-track { display: block; height: 4px; overflow: hidden; border-radius: var(--radius-pill); background: var(--border); }
.profile-category-track i { display: block; height: 100%; min-width: 0; border-radius: inherit; }
.profile-category-arrow { color: var(--text-3); font-size: var(--type-label); }
.profile-category-arrow { transition: transform var(--motion-fast) var(--ease-spring), color var(--motion-fast) ease; }
.profile-category-row:hover .profile-category-arrow { color: var(--accent); transform: translateX(3px); }
.profile-account-details { overflow: hidden; }
.profile-account-details > summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  min-height: 66px;
  padding: .85rem 1rem;
  cursor: pointer;
  list-style: none;
}
.profile-account-details > summary::-webkit-details-marker { display: none; }
.profile-account-details > summary > span:first-child { display: flex; flex-direction: column; min-width: 0; }
.profile-account-details > summary strong { color: var(--text-1); font-size: var(--type-control); }
.profile-account-details > summary small { overflow: hidden; color: var(--text-3); font-size: var(--type-caption); text-overflow: ellipsis; white-space: nowrap; }
.profile-account-details > summary > span:last-child { color: var(--text-3); transition: transform var(--motion-fast) ease; }
.profile-account-details[open] > summary > span:last-child { transform: rotate(180deg); }
.profile-account-body { display: grid; gap: .75rem; padding: 0 1rem 1rem; border-top: 1px solid var(--border); }
.profile-account-main { display: flex; align-items: center; gap: .85rem; padding-top: 1rem; }
.profile-backup-panel { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .75rem; border: 1px solid var(--border); border-radius: 14px; background: var(--bg-3); }
.profile-backup-panel > div { display: flex; flex-direction: column; min-width: 0; }
.profile-backup-panel strong { color: var(--text-1); font-size: var(--type-label); }
.profile-backup-panel span { color: var(--text-3); font-size: var(--type-caption); }
.profile-backup-actions { display: flex; align-items: center; gap: .5rem; flex: 0 0 auto; }
.profile-backup-actions .btn { min-width: 118px; justify-content: center; }

.backup-restore-modal { --modal-max-width: 520px; }
.backup-restore-heading { min-width: 0; }
.backup-restore-heading > span {
  display: block;
  margin-bottom: .15rem;
  color: var(--text-3);
  font-size: var(--type-caption);
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.backup-restore-heading h3 { margin: 0; }
.backup-restore-body { display: grid; gap: .9rem; }
.backup-restore-body > p { margin: 0; color: var(--text-2); font-size: var(--type-control); line-height: 1.55; }
.backup-restore-counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .55rem; }
.backup-restore-count {
  display: grid;
  gap: .08rem;
  min-width: 0;
  padding: .75rem .7rem;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg-3);
  text-align: center;
}
.backup-restore-count strong { color: var(--text-1); font-size: var(--type-title-sm); }
.backup-restore-count span { color: var(--text-3); font-size: var(--type-caption); }
.backup-restore-count.is-added strong { color: var(--brand-gold); }
.backup-restore-count.is-updated strong { color: var(--brand-coral); }
.backup-restore-journal {
  display: flex;
  align-items: center;
  gap: .65rem;
  padding: .7rem .8rem;
  border: 1px solid color-mix(in srgb, var(--brand-teal) 30%, var(--border));
  border-radius: 12px;
  background: color-mix(in srgb, var(--brand-teal) 8%, var(--bg-3));
  color: var(--text-2);
  font-size: var(--type-caption);
  line-height: 1.4;
}
.backup-restore-journal > span:first-child { color: var(--brand-teal); font-size: var(--type-title-sm); font-weight: 800; }
.backup-restore-journal strong { color: var(--text-1); }
.backup-restore-details { display: grid; gap: .4rem; }
.backup-restore-detail {
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg-3);
}
.backup-restore-detail > summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  padding: .68rem .8rem;
  color: var(--text-2);
  font-size: var(--type-caption);
  font-weight: 700;
  cursor: pointer;
  list-style: none;
}
.backup-restore-detail > summary::-webkit-details-marker { display: none; }
.backup-restore-detail > summary strong { color: var(--text-1); }
.backup-restore-detail.is-conflict > summary,
.backup-restore-detail.is-conflict > summary strong { color: var(--brand-coral); }
.backup-restore-detail ul {
  display: grid;
  gap: .45rem;
  max-height: 150px;
  margin: 0;
  padding: .65rem .8rem .75rem 1.75rem;
  overflow: auto;
  border-top: 1px solid var(--border);
  color: var(--text-2);
  font-size: var(--type-caption);
}
.backup-restore-detail li > span,
.backup-restore-detail li > small { display: block; }
.backup-restore-detail li > small { margin-top: .08rem; color: var(--text-3); font-size: var(--type-micro); }
.backup-restore-rule,
.backup-restore-warning {
  display: flex;
  align-items: flex-start;
  gap: .55rem;
  padding: .7rem .8rem;
  border-radius: 12px;
  background: color-mix(in srgb, var(--brand-teal) 9%, var(--bg-3));
  color: var(--text-2);
  font-size: var(--type-caption);
  line-height: 1.45;
}
.backup-restore-rule > span:first-child { color: var(--brand-teal); font-weight: 800; }
.backup-restore-warning { background: color-mix(in srgb, var(--brand-coral) 9%, var(--bg-3)); color: var(--brand-coral); }
.backup-restore-progress { min-height: 1.2em; color: var(--text-3); font-size: var(--type-caption); text-align: center; }
.backup-restore-footer .btn { min-width: 118px; justify-content: center; }
.profile-account-footer { display: flex; align-items: center; justify-content: space-between; gap: .75rem; color: var(--text-3); font-size: var(--type-caption); }

@media (max-width: 900px) {
  .profile-insights-grid { grid-template-columns: 1fr; }
  .profile-top-track { grid-template-columns: repeat(6, minmax(85px, 1fr)); }
}

@media (min-width: 681px) and (max-width: 1200px) {
  .upcoming-toolbar { grid-template-columns: minmax(0, 1fr) auto; }
  .upcoming-toolbar-main { grid-column: 1 / -1; }
  .upcoming-genre-filter { grid-column: 1; width: 100%; }
  .upcoming-toolbar-meta { grid-column: 2; }
}

@media (max-width: 680px) {
  /* Sur mobile, le logo reste seul et se cale sur la hauteur de la recherche. */
  #topbar { grid-template-columns: 88px minmax(0, 1fr) 42px; }
  .topbar-logo {
    width: 88px;
    min-height: 40px;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1;
    gap: 0;
  }
  .topbar-mark { width: 64px; height: 38px; }
  .topbar-right { width: 42px; min-width: 42px; }
  .topbar-brand-copy { display: none; }
  .topbar-tagline {
    display: none;
  }

  .active-filter-summary { margin-top: .55rem; padding: .4rem; }
  .active-filter-label { display: none; }
  .active-filter-reset { padding-right: .2rem; }

  .back-to-top { right: max(.85rem, calc(.45rem + var(--safe-right))); bottom: calc(84px + var(--safe-bottom)); }

  .upcoming-toolbar {
    grid-template-columns: minmax(0, 1fr) auto;
    gap: .5rem;
  }
  .upcoming-toolbar-main { grid-column: 1 / -1; }
  .upcoming-genre-filter { grid-column: 1; width: 100%; min-width: 0; }
  .upcoming-toolbar-meta { grid-column: 2; justify-content: flex-end; }
  .upcoming-toolbar-meta .section-count { display: none; }
  .compact-toggle { max-width: 142px; white-space: normal; line-height: 1.2; }
  .upcoming-month-heading { top: 112px; padding-left: .1rem; padding-right: .1rem; }

  .profile-year-overview,
  .profile-dashboard-card { padding: .8rem; border-radius: var(--radius-lg); }
  .profile-year-summary { grid-template-columns: minmax(0, 1.4fr) minmax(110px, .7fr); }
  .profile-year-primary,
  .profile-year-secondary { min-height: 104px; padding: .8rem; }
  .profile-year-primary strong { font-size: var(--type-metric-md); }
  .profile-year-primary span { font-size: var(--type-body); }
  .profile-year-secondary strong { font-size: var(--type-title-md); }
  .profile-action-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .profile-action-card { min-height: 68px; }
  .profile-top-track {
    display: flex;
    gap: var(--media-rail-gap);
    margin: -.35rem calc(-1 * var(--media-rail-gutter));
    padding: .35rem var(--media-rail-gutter) .5rem;
    overflow-x: auto;
    scroll-snap-type: x proximity;
    scroll-padding-inline: var(--media-rail-gutter);
    scrollbar-width: none;
  }
  .profile-top-track::-webkit-scrollbar { display: none; }
  .profile-top-card { flex: 0 0 92px; scroll-snap-align: start; }
  .profile-account-main { align-items: flex-start; }
  .profile-username-row { flex-wrap: wrap; }
  .profile-username-row input { width: min(190px, 100%); }
  .profile-backup-panel { align-items: flex-start; flex-direction: column; }
  .profile-backup-actions { width: 100%; }
  .profile-backup-actions .btn { width: 100%; min-width: 0; justify-content: center; }
  .backup-restore-counts { gap: .4rem; }
  .backup-restore-count { padding: .65rem .35rem; }

  /* La fiche montre les actions plus tôt, sans masquer aucune information. */
  .detail-backdrop { height: 158px; }
  .detail-backdrop.has-backdrop { height: 178px; }
  .detail-backdrop-content { gap: .75rem; padding: .75rem 1rem; }
  .detail-poster,
  .detail-poster-placeholder { width: 62px; min-width: 62px; height: 92px; }
  .detail-title { font-size: var(--type-detail-title); }
  .detail-rating { margin-bottom: .25rem; }
  .detail-body { max-height: calc(92dvh - 220px); }
}

@media (max-width: 390px) {
  #topbar { grid-template-columns: 82px minmax(0, 1fr) 42px; }
  .topbar-logo { width: 82px; font-size: var(--type-title-sm); }
  .topbar-mark { width: 60px; height: 36px; }
  .profile-year-summary { grid-template-columns: 1fr; }
  .profile-year-primary,
  .profile-year-secondary { min-height: 88px; }
  .profile-year-secondary { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; align-items: center; }
  .profile-year-secondary strong { grid-column: 2; grid-row: 1 / 3; margin: 0; }
}

/* ============================================================
   KULTURO 2.4 — FICHES, PROFIL ET MODALES
   ============================================================ */

/* L'action destructive garde une icône lisible dans tous les thèmes. */
.detail-delete-action {
  flex: 0 0 38px;
  width: 38px;
  min-width: 38px;
  height: 38px;
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 72%, var(--border));

/* Indicateur de revisionnage à côté du coup de cœur. */
.detail-repeat {

.card-markers { display: inline-flex; align-items: center; gap: .35rem; margin-left: auto; }

.quick-repeat-stepper {

}

  place-items: center;

}
.quick-repeat-row .quick-repeat-adjust { width: 40px; min-width: 40px; }
.quick-repeat-adjust:first-child { border-right: 1px solid var(--border); }
.quick-repeat-adjust:last-child { border-left: 1px solid var(--border); }
.quick-repeat-adjust:not(:disabled):hover { background: var(--bg-4); color: var(--accent-2); }
.quick-repeat-adjust:disabled { cursor: not-allowed; opacity: .35; }
.quick-repeat-value {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .35rem;
  min-width: 0;
  padding: .4rem .5rem;

  white-space: nowrap;
}
.quick-repeat-value .icon-repeat { flex: 0 0 auto; color: var(--accent); }
.quick-repeat-stepper.is-progress {
  border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
  background: var(--accent-glow);
}
.quick-repeat-stepper.is-progress .quick-repeat-value { color: var(--accent-2); }

/* Sélecteurs compacts du profil : période puis catégorie. */
.profile-date-controls { display: flex; align-items: center; justify-content: flex-end; gap: .4rem; }
.profile-month-inline { width: auto; min-width: 126px; }

}
.profile-period-switch,
.profile-media-switch {

}
.profile-period-switch button,
.profile-media-switch button {
  min-height: 30px;

@media (max-width: 680px) {

  .edit-details-trigger-icon {
    display: grid;

    width: 32px;
    height: 32px;

  .edit-details-trigger-copy { display: flex; flex: 1; flex-direction: column; min-width: 0; }
  .edit-details-trigger-copy strong { color: var(--text-1); font-size: var(--type-control); }
  .edit-details-trigger-copy small {

  .edit-modal[data-edit-view="main"] .edit-details-panel { display: none; }
  .edit-modal[data-edit-view="details"] .edit-primary-view { display: none; }
  .edit-modal[data-edit-view="details"] .edit-details-panel {
    display: block;

    border-radius: 0;
  }
  .edit-modal[data-edit-view="details"] .advanced-summary { display: none; }
  .edit-modal[data-edit-view="details"] .advanced-body {

  .edit-modal[data-edit-view="details"] .edit-title-main { display: none; }

/* Même respiration sous le séparateur de chaque page. */

.upcoming-toolbar { margin-top: 1.15rem; }

@media (max-width: 680px) {
  #dashboard-content,
  .upcoming-toolbar { margin-top: .9rem; }

  }

  .activity-title { font-size: var(--type-lead); }

@media (max-width: 390px) {

/* ============================================================
   KULTURO 3.0 — JOURNAL, PROFIL INTERACTIF ET COHÉRENCE MOBILE
   ============================================================ */
.journal-mode-switch {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  width: min(100%, 420px);
  gap: .25rem;
  margin-top: 0;
  padding: .25rem;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--bg-2);
}
.journal-mode-btn {
  min-height: 40px;
  padding: .5rem .8rem;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--text-3);
  font: inherit;
  font-size: var(--type-control);
  font-weight: 800;
  cursor: pointer;
  transition: color var(--motion-fast) ease, background-color var(--motion-fast) ease, box-shadow var(--motion-fast) ease;
}
.journal-mode-btn.active {
  background: var(--accent);

  box-shadow: 0 4px 14px var(--accent-glow);
}
.journal-mode-btn:active { transform: scale(.98); }
.journal-mode-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.journal-panel[hidden] { display: none !important; }
.journal-loading {

}
.journal-event-row { min-height: 100px; }
.journal-event-label {
  display: flex;
  align-items: center;

}
.journal-event-label > span {
  display: grid;
  place-items: center;
  flex: 0 0 24px;

  height: 24px;
  border-radius: 8px;
  background: var(--accent-glow);
  color: var(--accent);
}
.journal-rating-badge {

}
.journal-date-group .activity-date-label { text-transform: capitalize; }
.community-date-group .activity-date-label { text-transform: capitalize; }
.community-rating { font-size: var(--type-label); }
.rating-hist-avg .rating-score { font-size: inherit; }
.activity-detail-notice {

  align-items: center;
  gap: .65rem;
  padding: .7rem .8rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);

  color: var(--text-2);
  font-size: var(--type-control);
}
.activity-detail-notice strong { color: var(--text-1); }
.activity-detail-avatar {

  place-items: center;

}
.activity-detail-avatar svg { width: 17px; height: 17px; }
.detail-footer-actions-readonly { width: 100%; justify-content: flex-end; }

/* Les barres de notes sont de vrais boutons accessibles. */
.rating-hist-col {
  min-width: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  appearance: none;
  -webkit-appearance: none;
}
.rating-hist-col.is-clickable { cursor: pointer; }
.rating-hist-col.is-clickable:hover .rating-hist-bar,
.rating-hist-col.is-clickable:focus-visible .rating-hist-bar {
  opacity: 1;
  box-shadow: 0 0 0 2px var(--accent-glow);
}
.rating-hist-col.is-clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.rating-hist-col:disabled { cursor: default; }

/* Passe de finition motion : chaque mouvement confirme une action sans ralentir. */
@keyframes surfaceRefresh {
  from { opacity: 0; transform: translateY(7px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes feedGroupIn {
  from { opacity: 0; transform: translateY(9px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes barGrowY {
  from { opacity: .45; transform: scaleY(.08); }
  to { opacity: 1; transform: scaleY(1); }
}
@keyframes barGrowX {
  from { opacity: .45; transform: scaleX(.08); }
  to { opacity: 1; transform: scaleX(1); }
}
@keyframes accountReveal {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

.dashboard-refresh > * {
  animation: surfaceRefresh var(--motion-base) var(--ease-out) both;
}
.dashboard-refresh > *:nth-child(2) { animation-delay: 35ms; }
.dashboard-refresh > *:nth-child(3) { animation-delay: 70ms; }
.dashboard-refresh > *:nth-child(4) { animation-delay: 105ms; }
.journal-panel-enter { animation: surfaceRefresh var(--motion-base) var(--ease-out) both; }
.journal-panel-enter .activity-date-group {
  animation: feedGroupIn var(--motion-base) var(--ease-out) both;
}
.journal-panel-enter .activity-date-group:nth-child(2) { animation-delay: 35ms; }
.journal-panel-enter .activity-date-group:nth-child(3) { animation-delay: 70ms; }
.journal-panel-enter .activity-date-group:nth-child(n+4) { animation-delay: 95ms; }
.activity-row {
  transition: border-color var(--motion-fast) ease,
              background-color var(--motion-fast) ease,
              transform var(--motion-fast) var(--ease-smooth);
}
.dashboard-refresh .rating-hist-bar {
  transform-origin: center bottom;
  animation: barGrowY var(--motion-slow) var(--ease-out) both;
}
.dashboard-refresh .rating-hist-col:nth-child(2) .rating-hist-bar { animation-delay: 25ms; }
.dashboard-refresh .rating-hist-col:nth-child(3) .rating-hist-bar { animation-delay: 50ms; }
.dashboard-refresh .rating-hist-col:nth-child(4) .rating-hist-bar { animation-delay: 75ms; }
.dashboard-refresh .rating-hist-col:nth-child(5) .rating-hist-bar { animation-delay: 100ms; }
.dashboard-refresh .rating-hist-col:nth-child(6) .rating-hist-bar { animation-delay: 125ms; }
.dashboard-refresh .rating-hist-col:nth-child(7) .rating-hist-bar { animation-delay: 150ms; }
.dashboard-refresh .rating-hist-col:nth-child(8) .rating-hist-bar { animation-delay: 175ms; }
.dashboard-refresh .rating-hist-col:nth-child(9) .rating-hist-bar { animation-delay: 200ms; }
.dashboard-refresh .rating-hist-col:nth-child(10) .rating-hist-bar { animation-delay: 225ms; }
.dashboard-refresh .profile-category-track i {
  transform-origin: left center;

}
.profile-account-details[open] .profile-account-body { animation: accountReveal var(--motion-base) var(--ease-out) both; }
.edit-view-enter { animation: surfaceRefresh var(--motion-base) var(--ease-out) both; }
.active-filter-summary:not([hidden]) { animation: surfaceRefresh var(--motion-fast) var(--ease-out) both; }

.bottom-nav-item svg,
.bottom-nav-item > span:not(.sr-only) {
  transition: transform var(--motion-fast) var(--ease-spring), color var(--motion-fast) ease;
}
.bottom-nav-item.active svg { transform: translateY(-2px) scale(1.04); }
.bottom-nav-item:active svg { transform: scale(.9); }

@media (max-width: 680px) {
  /* .7rem de padding interne + .2rem de marge = le même départ visuel
     de .9rem que Profil, Journal et Bibliothèque. */

/* ============================================================
   Kulturo 3.3 — continuité, recherche et sorties attendues
   ============================================================ */

:root {
  --system-bar-color: var(--bg);
  /* Charte des contrôles : deux tailles, deux rayons et un rythme commun. */
  --control-height: 40px;
  --control-height-sm: 36px;
  --control-radius: 12px;
  --control-radius-inner: 9px;
  --control-padding-inline: .85rem;
  --control-gap: .4rem;
}

html,
body { background-color: var(--system-bar-color); }
#app { background: var(--bg); }

/* Charte commune des boutons ---------------------------------- */
.btn {
  min-height: var(--control-height);
  padding-inline: var(--control-padding-inline);
  border-radius: var(--control-radius);
  gap: var(--control-gap);
  font-size: var(--type-control);
  font-weight: 700;
}
.btn-sm {
  min-height: var(--control-height-sm);
  padding: .4rem .72rem;
  border-radius: var(--control-radius-inner);
  font-size: var(--type-control);
}
.btn-icon,
.topbar-filter-btn {
  width: var(--control-height);
  min-width: var(--control-height);
  height: var(--control-height);
  min-height: var(--control-height);
  padding: 0;
  border-radius: var(--control-radius);
}
.filter-chip,
.category-tab {
  min-height: var(--control-height-sm);
  padding: .4rem .78rem;
  font-size: var(--type-control);
}
.filter-select,
.journal-time-step,
.journal-month-select-wrap select {
  min-height: var(--control-height-sm);
  border-radius: var(--control-radius-inner);
}
.journal-time-nav {
  grid-template-columns: var(--control-height-sm) minmax(150px, 1fr) var(--control-height-sm);
}
.journal-time-step { width: var(--control-height-sm); }
.btn-icon-only,
.detail-delete-action {
  width: var(--control-height);
  min-width: var(--control-height);
  height: var(--control-height);
  min-height: var(--control-height);
  border-radius: var(--control-radius);
}
.detail-delete-action { flex-basis: var(--control-height); }
.sidebar-add-btn { border-radius: var(--control-radius); }

/* Un segment est toujours un panneau 14px contenant des boutons 9px.
   Les couleurs restent sémantiques, mais la géométrie ne change plus
   entre Sorties, Journal, Profil et les fiches. */
.upcoming-type-switch,
.journal-mode-switch,
.profile-period-switch,
.profile-media-switch,
.quick-status-control,
.modal-type-tabs {
  gap: .25rem;
  padding: .25rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-2);
}
.upcoming-type-btn,
.journal-mode-btn,
.profile-period-switch button,
.profile-media-switch button,
.quick-status-btn,
.modal-type-tab,
.modal-wizard .wz-status-btn {
  min-height: var(--control-height-sm);
  padding: .4rem .65rem;
  border: 1px solid transparent;
  border-radius: var(--control-radius-inner);
  background: transparent;
  color: var(--text-3);
  font-size: var(--type-label);
  font-weight: 750;
  box-shadow: none;
}
.upcoming-type-btn.active,
.journal-mode-btn.active,
.profile-period-switch button.active,
.profile-media-switch button.active,
.quick-status-btn.active,
.modal-type-tab.active,
.modal-wizard .wz-status-btn.active {
  border-color: color-mix(in srgb, var(--accent) 52%, transparent);
  background: var(--accent-glow);
  color: var(--accent-2);
  box-shadow: 0 2px 10px rgba(0,0,0,.16);
}
.upcoming-refresh-btn {
  width: auto;
  min-width: var(--control-height);
  min-height: var(--control-height);
  padding-inline: .75rem;
  border-radius: var(--control-radius);
}
.profile-action-card,
.profile-category-row,
.profile-top-cover,
.profile-backup-panel,
.library-density-btn { border-radius: var(--radius); }

/* États communs ------------------------------------------------ */
.ui-state {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .75rem;
  min-height: 150px;
  color: var(--text-3);
  padding: 2.5rem 1rem;
  text-align: center;
  font-size: var(--type-body);
}
.ui-state.is-compact { min-height: 88px; padding: 1rem; }
.ui-state-empty { flex-direction: column; }
.ui-state .empty-icon {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border-radius: var(--radius);
  background: var(--bg-3);
  color: var(--text-3);
}
.ui-state .empty-icon svg { width: 25px; height: 25px; }
.ui-state h3 { color: var(--text-2); font-size: var(--type-lead); font-weight: 700; }
.ui-state p { max-width: 32ch; font-size: var(--type-body); }
.ui-state-actions { margin-top: .25rem; display: flex; justify-content: center; gap: .5rem; }
.btn.is-saving { position: relative; color: transparent; }
.btn.is-saving::after {
  content: "";
  position: absolute;
  left: calc(50% - 8px);
  top: calc(50% - 8px);
  width: 16px;
  height: 16px;
  border: 2px solid currentColor;
  color: var(--text);
  border-right-color: transparent;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
.modal-overlay.is-modal-replacement,
.modal-overlay.is-modal-replacement .modal { animation: none; }
.is-restoring-view .detail-synopsis-clip { transition: none; }
.upcoming-loading { min-width: 0; }
.upcoming-loading > .ui-state { min-height: 44px; padding: .35rem 0 .75rem; justify-content: flex-start; font-size: var(--type-control); }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
.ui-state-error .empty-icon {
  background: color-mix(in srgb, var(--danger) 13%, var(--bg-3));
  color: var(--danger);
}

/* Images récupérées : le reste du composant ne bouge pas. */
.fade-image {
  opacity: 0;
  transition: opacity var(--motion-content) var(--ease-interface) !important;
}
.fade-image.is-loaded { opacity: 1; }

/* Transition partagée jaquette → fiche. Le clone reste sur sa propre couche
   GPU pendant que la feuille se pose derrière lui. */
.detail-cover-flight {
  position: fixed;
  z-index: 1200;
  display: block;
  margin: 0;
  object-fit: cover;
  pointer-events: none;
  transform: translateZ(0);
  transform-origin: left top;
  will-change: transform, border-radius, box-shadow;
}
.is-cover-transition-source,
.is-cover-transition-target {
  visibility: hidden !important;
  opacity: 0 !important;
}
.is-cover-transition-handoff {
  transition: none !important;
}
.modal-overlay.has-cover-transition .detail-modal {
  animation: detailSharedShellIn var(--motion-cover) var(--ease-interface) both;
}

/* La fiche réserve sa géométrie finale avant le départ de la jaquette.
   Les enrichissements grandissent dans le corps défilable sans déplacer le
   panneau centré, ce qui stabilise la destination sur iPad et desktop. */
.detail-modal {
  height: min(760px, calc(100dvh - 2rem - var(--safe-top) - var(--safe-bottom)));
  max-height: min(760px, calc(100dvh - 2rem - var(--safe-top) - var(--safe-bottom)));
  contain: layout paint;
}
.detail-modal .detail-body {
  flex: 1;
  min-height: 0;
  max-height: none;
  overscroll-behavior: contain;
}

@media (max-width: 680px) {
  .detail-modal {
    height: min(760px, calc(92dvh - var(--safe-top)));
    max-height: min(760px, calc(92dvh - var(--safe-top)));
  }
}

@keyframes detailSharedShellIn {
  /* La jaquette porte déjà le mouvement. Garder la géométrie de la fiche
     fixe garantit que sa destination ne se déplace pas pendant la course. */
  from { opacity: .38; }
  to { opacity: 1; }
}
.modal-overlay.has-cover-transition.is-cover-transition-closing {
  animation: detailSharedOverlayOut var(--motion-cover) var(--ease-interface) both;
}
.modal-overlay.has-cover-transition.is-cover-transition-closing .detail-modal {
  animation: detailSharedShellOut var(--motion-cover) var(--ease-interface) both;
}
@keyframes detailSharedOverlayOut {
  from { opacity: 1; backdrop-filter: blur(6px); }
  to { opacity: 0; backdrop-filter: blur(0); }
}
@keyframes detailSharedShellOut {
  from { opacity: 1; transform: translateY(0) scale(1); }
  to { opacity: .18; transform: translateY(8px) scale(.992); }
}

/* Icônes d'interface : une seule famille SVG, indépendante des emojis système. */
.ui-icon {
  display: inline-block;
  width: 1em;
  height: 1em;
  flex: 0 0 auto;
  vertical-align: -.12em;
}
.ui-icon-favorite { color: var(--brand-coral); }
.ui-icon-finished { color: var(--brand-teal); }
.community-favorite { color: var(--brand-coral); font-size: var(--type-body); line-height: 1; }
.activity-title > .ui-icon-movie { color: var(--brand-coral); }
.activity-title > .ui-icon-tv { color: var(--brand-blue); }
.activity-title > .ui-icon-game { color: var(--brand-teal); }
.activity-title > .ui-icon-book { color: var(--brand-gold); }
.activity-state-markers {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
}
.activity-favorite-marker {
  color: var(--brand-coral);
  font-size: var(--type-body);
  line-height: 1;
}
.activity-repeat-marker {
  display: inline-flex;
  align-items: center;
  gap: .15rem;
  color: var(--brand-teal);
  font-size: var(--type-label);
  font-weight: 750;
  line-height: 1;
}
.activity-repeat-marker .icon-repeat { width: 13px; height: 13px; }
.favorite-filter-chip.active {
  border-color: var(--brand-coral);

  color: var(--brand-coral);
  box-shadow: 0 4px 16px var(--brand-coral-glow);
}
.favorite-filter-chip:hover { border-color: var(--brand-coral); color: var(--brand-coral); }
.replay-filter-chip .icon-repeat { color: var(--brand-teal); }
.replay-filter-chip:hover { border-color: var(--brand-teal); color: var(--brand-teal); }
.replay-filter-chip.active {
  border-color: var(--brand-teal);
  background: var(--brand-teal-glow);
  color: var(--brand-teal);
  box-shadow: 0 4px 16px var(--brand-teal-glow);
}
.card-cover-placeholder .ui-icon,
.detail-poster-placeholder .ui-icon,
.wz-selected-placeholder .ui-icon,
.api-result-placeholder .ui-icon,
.activity-cover-ph .ui-icon,
.empty-icon .ui-icon { width: 1.35em; height: 1.35em; }
.continue-preview-placeholder > .ui-icon { width: 1.15em; height: 1.15em; }
.continue-preview-cover > .continue-preview-placeholder {
  width: 100%;
  height: 100%;
  place-items: center;
}
.card-status-label,
.filter-chip,
.modal-type-tab,
.wz-manual-types button,
.detail-ext-link,
.activity-title { align-items: center; }
.filter-chip,
.modal-type-tab,
.wz-manual-types button { display: inline-flex; justify-content: center; gap: .35rem; }
.card-status-label { display: inline-flex; gap: .3rem; }
.profile-category-icon,
.profile-action-icon { display: grid; place-items: center; }
.profile-category-icon .ui-icon,
.profile-action-icon .ui-icon { width: 1.05rem; height: 1.05rem; }
.profile-top-rank { z-index: 4; }
.upcoming-refresh-icon .ui-icon { width: .95rem; height: .95rem; }

/* Sorties attendues : exactement le panneau et la rangée « À reprendre ». */
.awaited-section {
  min-width: 0;
  margin-bottom: 1rem;
  background:
    radial-gradient(circle at 0 0, var(--brand-coral-glow), transparent 36%),
    var(--bg-2);
}
.awaited-section:hover {
  border-color: color-mix(in srgb, var(--brand-coral) 26%, var(--border));
}
.awaited-release-track { overscroll-behavior-inline: contain; }
.awaited-release-card {
  flex-basis: 128px;
}
.awaited-release-visual {
  isolation: isolate;
}
.awaited-release-cover,
.awaited-release-placeholder {
  display: flex;
  width: 100%;
  height: 100%;
  align-items: center;
  justify-content: center;
  object-fit: cover;
}
.awaited-release-placeholder { color: var(--text-3); }
.awaited-release-timing {
  position: absolute;
  top: .45rem;
  right: .45rem;
  padding: .26rem .46rem;
  border: 1px solid color-mix(in srgb, var(--brand-gold) 36%, transparent);
  border-radius: var(--radius-pill);
  background: rgba(12,13,17,.84);
  color: var(--brand-gold);
  backdrop-filter: blur(8px);
  font-size: var(--type-micro);
  font-weight: 800;
  line-height: 1;
}
.awaited-release-timing.is-available {
  border-color: color-mix(in srgb, var(--brand-teal) 42%, transparent);
  color: var(--brand-teal);
}

@media (max-width: 680px) {
  .awaited-section { margin-top: .9rem; margin-bottom: .75rem; }
  .awaited-release-card { flex-basis: 112px; }
}

/* La découverte reprend la grille de la Bibliothèque : seule la jaquette est
   visible. Le titre, la date et les informations éditoriales restent dans la
   fiche, tandis que les marqueurs utiles vivent directement sur l'affiche. */
.upcoming-months { gap: 1.15rem; }
.upcoming-month-section { min-width: 0; }
.upcoming-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: .9rem;
}
.upcoming-card {
  position: relative;
  height: auto;
  min-width: 0;
  gap: 0;
}
.upcoming-cover-wrap {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 2 / 3;
  overflow: hidden;
  border-radius: var(--radius);
  background: var(--bg-3);
}
.upcoming-card-open {
  display: block;
  width: 100%;
  height: 100%;
  padding: 0;
  overflow: hidden;
  border: 0;
  border-radius: inherit;
  background: transparent;
  color: inherit;
}
.upcoming-card-open > :is(.card-cover, .card-cover-placeholder) {
  width: 100%;
  height: 100%;
  aspect-ratio: auto;
  border-radius: inherit;
  object-fit: cover;
}
.upcoming-card-open:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -3px;
}
.release-countdown {
  top: .5rem;
  right: .5rem;
  z-index: 3;
  padding: .25rem .44rem;
  border-radius: var(--radius-pill);
  font-size: var(--type-micro);
  line-height: 1;
}
.upcoming-wishlist-mark {
  position: absolute;
  right: .5rem;
  bottom: .5rem;
  z-index: 5;
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: var(--control-radius-inner);
  background: rgba(12,13,17,.78);
  color: var(--text-2);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  transition: color var(--motion-feedback) ease,
              border-color var(--motion-feedback) ease,
              background-color var(--motion-feedback) ease,
              transform var(--motion-touch) ease;
}
.upcoming-wishlist-mark .ui-icon { width: 15px; height: 15px; }
.upcoming-wishlist-mark:hover {
  border-color: color-mix(in srgb, var(--accent) 48%, transparent);
  color: var(--accent-2);
  background: color-mix(in srgb, var(--accent) 14%, rgba(12,13,17,.88));
}
.upcoming-wishlist-mark:active { transform: scale(.94); }
.upcoming-wishlist-mark.is-added {
  border-color: color-mix(in srgb, var(--accent) 52%, transparent);
  background: color-mix(in srgb, var(--accent) 20%, rgba(12,13,17,.84));
  color: var(--accent-2);
}
.upcoming-wishlist-mark.is-adding { cursor: wait; }
.upcoming-wishlist-mark.is-adding .ui-icon { opacity: 0; }
.upcoming-wishlist-mark.is-adding::after {
  content: "";
  position: absolute;
  width: 13px;
  height: 13px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@media (min-width: 681px) and (max-width: 900px) {
  .upcoming-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
}

@media (min-width: 681px) {
  html[data-library-density="compact"] .upcoming-grid {
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
    gap: .55rem;
  }
}

@media (max-width: 680px) {
  .upcoming-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; }
  .upcoming-months { gap: 1rem; }
  .upcoming-refresh-btn {
    width: var(--control-height);
    height: var(--control-height);
    padding: 0;
  }
  .upcoming-wishlist-mark { right: .4rem; bottom: .4rem; width: 30px; height: 30px; }
  .release-countdown { top: .4rem; right: .4rem; }
  html[data-library-density="compact"] .upcoming-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: .42rem;
  }
  html[data-library-density="compact"] .upcoming-wishlist-mark {
    width: 26px;
    height: 26px;
  }
}

/* Jaquettes : une interaction commune pour la bibliothèque, À reprendre,
   Sorties et le Top du profil. Les conteneurs, et non leurs seules images,
   se déplacent afin que le cadre et l'ombre restent solidaires. */
.media-card:not(.upcoming-card) > :is(.card-cover, .card-cover-placeholder),
.upcoming-card .upcoming-cover-wrap,
.continue-card .continue-cover,
.profile-top-card .profile-top-cover {
  position: relative;
  transform-origin: center;
  transition:
    transform var(--motion-base) var(--ease-interface),
    box-shadow var(--motion-base) var(--ease-interface),
    filter var(--motion-base) var(--ease-interface),
    opacity var(--motion-base) var(--ease-interface);
}
.upcoming-card .upcoming-cover-wrap {
  border-radius: var(--radius);
  box-shadow: var(--media-cover-shadow);
}
.upcoming-card .upcoming-cover-wrap > :is(.card-cover, .card-cover-placeholder) { box-shadow: none; }
.media-card.is-playing .card-status-label {
  border-color: color-mix(in srgb, var(--game) 36%, transparent);
  background: color-mix(in srgb, var(--game) 14%, rgba(12,13,17,.88));
  color: var(--game);
}

@media (hover: hover) and (pointer: fine) {
  .media-card:not(.upcoming-card):hover > :is(.card-cover, .card-cover-placeholder),
  .upcoming-card:hover .upcoming-cover-wrap,
  .continue-card:hover .continue-cover,
  .profile-top-card:hover .profile-top-cover {
    z-index: 3;
    transform: scale(var(--media-hover-scale));
    box-shadow: var(--media-cover-shadow-hover);
  }
  .media-card:is(.is-wishlist, .is-paused, .is-dropped):hover > :is(.card-cover, .card-cover-placeholder) {
    opacity: 1;
    filter: saturate(1);
  }
  .media-card:hover .card-status-label { opacity: 0; }
  .media-card.both:hover > :is(.card-cover, .card-cover-placeholder) {
    box-shadow: var(--media-cover-shadow-hover), 0 0 0 2px rgba(200,169,110,1), 0 0 24px 8px rgba(200,169,110,.4);
  }
}

@media (hover: none), (pointer: coarse) {
  .media-card:not(.upcoming-card):active > :is(.card-cover, .card-cover-placeholder),
  .upcoming-card:active .upcoming-cover-wrap,
  .continue-card:active .continue-cover,
  .profile-top-card:active .profile-top-cover {
    transform: scale(var(--media-press-scale));
    transition-duration: var(--motion-touch);
  }
}

/* Bibliothèque dense ------------------------------------------ */
.library-density-control {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: .45rem;
}
.library-density-btn {
  display: flex;
  align-items: center;
  gap: .55rem;
  min-height: 54px;
  padding: .55rem .65rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-3);
  color: var(--text-2);
  text-align: left;
}
.library-density-btn > span:first-child { color: var(--text-3); font-size: var(--type-title-sm); }
.library-density-btn > span:last-child { display: flex; min-width: 0; flex-direction: column; }
.library-density-btn strong { font-size: var(--type-label); }
.library-density-btn small { color: var(--text-3); font-size: var(--type-micro); }
.library-density-btn.active {
  border-color: color-mix(in srgb, var(--accent) 60%, var(--border));
  background: var(--accent-glow);
  color: var(--accent-2);
}
.library-density-btn.active > span:first-child { color: var(--accent); }

@media (min-width: 681px) {
  html[data-library-density="compact"] #cards-grid {
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
    gap: .55rem;
  }
  html[data-library-density="compact"] .card-bottom { min-height: .85rem; }
  html[data-library-density="compact"] .card-rating { font-size: var(--type-caption); }
  html[data-library-density="compact"] .card-status-label { bottom: 1.65rem; font-size: var(--type-micro); }
}

@media (max-width: 680px) {
  html[data-library-density="compact"] #cards-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: .42rem;
  }
  html[data-library-density="compact"] .card-rating { font-size: var(--type-micro); }
  html[data-library-density="compact"] .card-heart,
  html[data-library-density="compact"] .card-repeat { transform: scale(.82); transform-origin: right center; }
  html[data-library-density="compact"] .card-status-label { display: none; }
}

@keyframes localItemIn {
  from { opacity: 0; transform: translateY(7px) scale(.985); }
  to { opacity: 1; transform: none; }
}
.is-locally-added { animation: localItemIn var(--motion-content) var(--ease-enter) both; }

/* Accent de jaquette : si une image refuse l'analyse CORS, la fiche revient
   à l'or Kulturo. Elle ne reprend plus une couleur artificielle liée au type. */


/* Enrichissement local des fiches ---------------------------- */
.detail-synopsis-empty {
  margin: 0;
  color: var(--text-3);
  font-family: var(--font-body);
  font-size: var(--type-body);
  font-style: italic;
  line-height: 1.6;
}
.detail-info-content {
  display: flex;
  flex-direction: column;
  gap: .75rem;
}
.detail-info-content:empty { display: none; }
.detail-info-slot.is-transitioning { display: grid; }
.detail-info-slot.is-transitioning > .detail-info-content { grid-area: 1 / 1; }
.detail-info-arriving { animation: detailInfoLocalIn var(--motion-content) var(--ease-interface) both; }
.detail-info-leaving { pointer-events: none; animation: detailInfoLocalOut var(--motion-feedback) var(--ease-exit) both; }
@keyframes detailInfoLocalIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: none; }
}
@keyframes detailInfoLocalOut {
  from { opacity: 1; }
  to { opacity: 0; }
}
.detail-info-skeleton {
  display: grid;
  gap: .45rem;
  padding: .15rem 0;
}
.detail-info-skeleton i {
  width: 72%;
  height: 10px;
  border-radius: var(--radius-pill);
  background: linear-gradient(90deg, var(--bg-3), var(--bg-4), var(--bg-3));
  background-size: 220% 100%;
  animation: detailSynopsisShimmer var(--motion-shimmer) ease-in-out infinite;
}
.detail-info-skeleton i + i { width: 51%; }

/* Journal temporel ------------------------------------------- */
.journal-sticky-controls {
  position: sticky;
  top: 0;
  z-index: 80;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .7rem;
  margin: 0 0 .8rem;
  padding: .65rem 0;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg) 95%, transparent);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
}
.journal-time-nav {
  display: grid;
  grid-template-columns: 34px minmax(150px, 1fr) 34px;
  align-items: center;
  gap: .3rem;
}
.journal-time-step,
.journal-month-select-wrap select {
  min-height: 34px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--bg-2);
  color: var(--text-2);
  font: inherit;
  font-size: var(--type-label);
  font-weight: 750;
}
.community-event-label { color: var(--text-3); }
.community-event-label strong { color: var(--text-1); font-weight: 800; }
.journal-time-step { display: grid; place-items: center; width: 34px; }
.journal-time-step:disabled { opacity: .35; }
.journal-month-select-wrap select { width: 100%; padding: .35rem 1.8rem .35rem .65rem; }
.journal-month-group { scroll-margin-top: 112px; }
.journal-month-group + .journal-month-group { margin-top: 1.2rem; }
.journal-month-heading {
  margin: 0 0 .65rem;
  color: var(--text-1);
  font-family: var(--font-body);
  font-size: var(--type-body);
  font-weight: 800;
  text-transform: capitalize;
}
.journal-month-summary {
  margin: .8rem 0 2rem;
  padding: .8rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, var(--accent-glow), transparent 52%), var(--bg-2);
}
.journal-month-summary-heading,
.journal-month-summary-stats,
.journal-month-favorite { display: flex; align-items: center; }
.journal-month-summary-heading { justify-content: space-between; gap: .5rem; margin-bottom: .6rem; }
.journal-month-summary-heading span { color: var(--accent-2); font-size: var(--type-caption); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
.journal-month-summary-heading strong { color: var(--text-3); font-size: var(--type-caption); }
.journal-month-summary-stats { gap: .45rem; }
.journal-month-summary-stats > span {
  display: flex;
  flex: 1;
  align-items: baseline;
  gap: .35rem;
  padding: .5rem .6rem;
  border-radius: 11px;
  background: color-mix(in srgb, var(--bg-3) 82%, transparent);
}
.journal-month-summary-stats strong { color: var(--text-1); font-size: var(--type-body); }
.journal-month-summary-stats small { color: var(--text-3); font-size: var(--type-caption); }
.journal-month-favorite {
  width: 100%;
  gap: .65rem;
  margin-top: .55rem;
  padding: .5rem;
  border: 1px solid color-mix(in srgb, var(--brand-coral) 24%, var(--border));
  border-radius: 12px;
  background: color-mix(in srgb, var(--brand-coral) 7%, var(--bg-3));
  color: var(--text-1);
  text-align: left;
}
.journal-month-favorite img,
.journal-month-favorite > span:first-child { width: 34px; height: 48px; border-radius: 7px; object-fit: cover; }
.journal-month-favorite > span:nth-child(2) { display: flex; flex: 1; min-width: 0; flex-direction: column; }
.journal-month-favorite small { color: var(--brand-coral); font-size: var(--type-micro); }
.journal-month-favorite strong { overflow: hidden; font-size: var(--type-label); text-overflow: ellipsis; white-space: nowrap; }
.journal-month-favorite-rating { font-size: var(--type-caption); white-space: nowrap; }
.journal-month-no-favorite { margin: .55rem 0 0; color: var(--text-3); font-size: var(--type-caption); }

/* Actions condensées du Journal ----------------------------- */
.journal-event-main {
  display: flex;
  align-items: center;
  flex: 1;
  min-width: 0;
  gap: 1rem;
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: left;
}
.journal-event-main .activity-info { display: block; }
.journal-event-main .activity-title,
.journal-event-main .journal-event-label,
.journal-event-main .activity-meta { display: flex; }
.journal-event-main .activity-title { display: block; }
.journal-event-delete {
  display: grid;
  place-items: center;
  flex: 0 0 30px;
  width: 30px;
  height: 30px;
  padding: 0;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--text-3);
  opacity: 0;
  transition: opacity var(--motion-feedback) ease, color var(--motion-feedback) ease, background-color var(--motion-feedback) ease, transform var(--motion-feedback) var(--ease-interface);
}
.journal-event-delete svg { width: 15px; height: 15px; }
.journal-event-row:hover .journal-event-delete,
.journal-event-row:focus-within .journal-event-delete { opacity: .72; }
.journal-event-delete:hover,
.journal-event-delete:focus-visible { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); opacity: 1; }
.journal-event-delete:active { transform: scale(.9); }
.journal-event-row.is-removing { pointer-events: none; animation: journalEventOut var(--motion-feedback) var(--ease-exit) both; }
@keyframes journalEventOut {
  to { opacity: 0; transform: translateX(10px); }
}

.journal-event-group {
  margin: .45rem 0;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: linear-gradient(120deg, var(--accent-glow), transparent 48%), var(--bg-2);
  transition: border-color var(--motion-feedback) ease, background-color var(--motion-feedback) ease;
}
.journal-event-group.is-expanded { border-color: color-mix(in srgb, var(--accent) 38%, var(--border)); }
.journal-event-group-toggle {
  display: flex;
  align-items: center;
  width: 100%;
  min-height: 78px;
  gap: .8rem;
  padding: .7rem .8rem;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: left;
}
.journal-event-group-covers { position: relative; flex: 0 0 74px; width: 74px; height: 56px; }
.journal-event-group-covers > * {
  position: absolute;
  top: 0;
  display: grid;
  place-items: center;
  width: 38px;
  height: 56px;
  overflow: hidden;
  border: 2px solid var(--bg-2);
  border-radius: 8px;
  background: var(--bg-3);
  object-fit: cover;
  font-size: var(--type-body);
  box-shadow: 0 5px 14px rgba(0,0,0,.22);
}
.journal-event-group-covers > :nth-child(1) { left: 0; z-index: 3; }
.journal-event-group-covers > :nth-child(2) { left: 17px; z-index: 2; }
.journal-event-group-covers > :nth-child(3) { left: 34px; z-index: 1; }
.journal-event-group-copy { display: flex; flex: 1; min-width: 0; flex-direction: column; }
.journal-event-group-copy strong { display: flex; align-items: center; gap: .42rem; color: var(--text-1); font-size: var(--type-control); }
.journal-event-group-copy strong > span { color: var(--accent); }
.journal-event-label .icon-repeat,
.journal-event-group-copy .icon-repeat { color: var(--brand-teal); }
[data-event-tone="teal"] .journal-event-label > span {
  background: var(--brand-teal-glow);
  color: var(--brand-teal);
}
.journal-event-group[data-event-tone="teal"] .journal-event-group-copy strong > span { color: var(--brand-teal); }
.journal-event-group-copy small { margin-top: .16rem; color: var(--text-3); font-size: var(--type-caption); }
.journal-event-group-chevron { color: var(--text-3); transition: transform var(--motion-layout) var(--ease-interface), color var(--motion-feedback) ease; }
.journal-event-group.is-expanded .journal-event-group-chevron { color: var(--accent); transform: rotate(180deg); }
.journal-event-group-expand { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--motion-layout) var(--ease-interface); }
.journal-event-group.is-expanded .journal-event-group-expand { grid-template-rows: 1fr; }
.journal-event-group-inner { min-height: 0; overflow: hidden; }
.journal-event-group.is-expanded .journal-event-group-inner { padding: 0 .45rem .45rem; }
.journal-event-row.is-grouped { min-height: 82px; margin-top: .3rem; padding: .52rem; background: color-mix(in srgb, var(--bg-3) 72%, transparent); }

/* KULTURO — ÉDITION 4.1
 * Authoritative visual tokens and composition. Loaded after component styles.
 * No scroll hijacking, cursor replacement or continuous decoration animation.
 */
:root {
  --bg: #10110f; --bg-1: var(--bg); --bg-2: #181a17; --bg-3: #21231f; --bg-4: #2c2e28;
  --border: #30332c; --border-2: #494b40;

  --brand-gold: #d4b580; --brand-gold-glow: rgba(212,181,128,.12);
  --accent: var(--brand-gold); --accent-2: #ead3aa; --accent-glow: var(--brand-gold-glow);
  --radius-sm: 6px; --radius: 10px; --radius-lg: 14px; --radius-xl: 18px;
  --control-height: 44px; --control-height-sm: 38px;
  --control-radius: 8px; --control-radius-inner: 6px;
  --surface-radius: var(--radius-lg); --surface-gap: 1rem;

  --font-editorial: Georgia, 'Times New Roman', serif;
  --motion-touch: 110ms; --motion-fast: 140ms; --motion-feedback: 180ms;
  --motion-base: 220ms; --motion-content: 260ms; --motion-layout: 320ms; --motion-slow: 360ms;
  --motion-shimmer: 1.6s; --motion-cover: 360ms;
  --ease-standard: cubic-bezier(.22,.8,.2,1); --ease-interface: var(--ease-standard);

  --media-cover-shadow: 0 12px 25px -10px #0009, 0 0 0 1px #ffffff09;
  --media-cover-shadow-hover: 0 22px 36px -14px #000c, 0 0 0 1px #d4b58050;
  --media-hover-scale: 1; --media-press-scale: .985;
  --topbar-height: 76px;
}
::selection { color: var(--bg); background: var(--accent); }
body { color: var(--text); }
body.app-shell-active { overflow: hidden; }
body.app-shell-active #app { height: 100dvh; min-height: 100dvh; padding-bottom: 0; grid-template-rows: auto minmax(0,1fr); overflow: hidden; }
